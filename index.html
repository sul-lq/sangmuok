// 스와이프로 답장
function attachSwipeReply(){
  const box=document.getElementById('chat-messages');
  if(!box) return;
  box.querySelectorAll('.chat-msg').forEach(el=>{
    let startX=0, startY=0, dragging=false;
    el.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY; dragging=true;
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!dragging) return;
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(Math.abs(dy)>Math.abs(dx)){dragging=false;el.style.transform='';return;}
      // 왼쪽으로 스와이프 (dx < 0)
      if(dx<0 && dx>-80){ el.style.transform=`translateX(${dx}px)`; }
    },{passive:true});
    el.addEventListener('touchend',()=>{
      if(!dragging) return;
      dragging=false;
      const dx=el.style.transform.match(/translateX\((-?\d+)/);
      el.style.transform='';
      // 왼쪽으로 50px 이상이면 답장
      if(dx && parseInt(dx[1])<-50){
        startReply(el.getAttribute('data-id'));
      }
    });
    // PC: 더블클릭으로 답장
    el.addEventListener('dblclick',()=>startReply(el.getAttribute('data-id')));

    // 본인 메시지 메뉴: 길게누르기(모바일) / 우클릭(PC)
    if(el.classList.contains('mine')){
      let pressTimer=null;
      let longPressed=false;
      el.addEventListener('touchstart',()=>{
        longPressed=false;
        pressTimer=setTimeout(()=>{
          longPressed=true;
          dragging=false;
          el.style.transform='';
          openMessageActions(el.getAttribute('data-id'));
        },600);
      },{passive:true});
      el.addEventListener('touchend',()=>{
        clearTimeout(pressTimer);
        if(longPressed) dragging=false;
      });
      el.addEventListener('touchmove',()=>clearTimeout(pressTimer));
      el.addEventListener('contextmenu',e=>{
        e.preventDefault();
        openMessageActions(el.getAttribute('data-id'));
      });
    }
  });
}

async function askDeleteChat(msgId){
  const m=chatMessages.find(x=>String(x.id)===String(msgId));
  if(!m) return;
  if(!isMyMessage(m)){ showBanner('본인 메시지만 삭제할 수 있어요'); return; }
  if(!confirm(`이 메시지를 삭제할까요?\n\n"${m.text.slice(0,40)}"`)) return;

  const linked=findReservationFromMessage(m);
  if(linked&&confirm(`연결된 예약도 함께 취소할까요?\n\n${linked.res.name} ${linked.res.time} ${linked.res.people}명\n\n확인: 예약 취소\n취소: 메시지만 삭제`)){
    reservations[linked.dateKey][linked.slot]=reservations[linked.dateKey][linked.slot]
      .filter(r=>String(r.id)!==String(linked.res.id));
    try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
    autoSyncPaused=true;
    saveToSheet();
    setTimeout(()=>{autoSyncPaused=false;},10000);
    const d=new Date(linked.dateKey+'T00:00:00');
    addSystemChat(`❌ ${d.getMonth()+1}월 ${d.getDate()}일 · ${linked.res.name} 예약 취소됨 (예약톡 삭제)`);
    render();
    renderMap();
  }
  await deleteChat(m.id);
}

async function deleteChat(msgId){
  const id=String(msgId);
  deletedChatIds.add(id);
  saveDeletedIds();
  chatMessages=chatMessages.filter(x=>String(x.id)!==id);
  try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
  renderChat();
  autoSyncPaused=true;
  try{
    await SangmuokDB.deleteMessage(msgId);
  }catch(e){
    console.error(e);
    showBanner('메시지 삭제에 실패했어요');
    await loadChats();
  }finally{
    autoSyncPaused=false;
  }
}

async function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text) return;

  // 답장이면 예약 수정/취소 먼저 시도
  if(replyTarget){
    const handled=tryModifyByReply(replyTarget, text);
    if(handled){
      input.value=''; input.style.height='auto';
      cancelReply();
      scrollChatBottom();
      return;
    }
  }

  const now=new Date();
  const msg={id:Date.now(),time:now.toISOString(),senderId:currentUser?.uid||null,sender:currentSender,text};
  if(replyTarget) msg.replyTo=replyTarget.id;
  input.value='';
  input.style.height='48px';
  cancelReply();
  // 키보드 유지 (iOS Safari 대응 - readOnly 토글)
  input.readOnly=true;
  input.readOnly=false;
  input.focus();

  // 화면 즉시 반영
  chatMessages.push(msg);
  renderChat();
  scrollChatBottom();

  // DB 저장 (백그라운드)
  saveChat(msg);

  // 파싱 시도
  const result=parseReservationText(text);
  if(!result.error){
    const auto=document.getElementById('auto-register').checked;
    if(auto){ doRegisterFromChat(msg.id,result); }
  }
}

function doRegisterFromChat(msgId,result){
  if(registeredMsgIds.has(msgId)) return;
  const key=result.dateKey;
  if(!reservations[key])reservations[key]={am:[],pm:[]};
  reservations[key][result.slot].push({id:Date.now()+Math.random(),time:result.timeLabel,timeH:result.timeH,name:result.name,people:result.people,memo:result.memo,table:result.table||''});
  reservations[key][result.slot].sort((a,b)=>a.time.localeCompare(b.time));
  if(result.table) showBanner(`${result.name} 예약을 ${result.table}에 배치했습니다`);
  showCapacityRisk(key,result.slot);
  registeredMsgIds.add(msgId);
  saveToSheet();
  renderChat();
}

function renderChat(){
  const box=document.getElementById('chat-messages');
  if(!box) return;
  if(!chatMessages.length){
    box.innerHTML='<div style="text-align:center;color:#918981;font-size:13px;padding:40px 0">아직 메시지가 없어요.<br>예약을 입력해보세요.</div>';
    return;
  }
  const days=['일','월','화','수','목','금','토'];
  let html='', lastDate='';
  // 안 읽은 첫 메시지 위치 찾기 (내가 보낸 게 아니고, lastReadId 이후)
  let firstUnreadIdx=-1;
  if(lastReadId){
    for(let i=0;i<chatMessages.length;i++){
      if(chatMessages[i].id===lastReadId){
        // 그 다음 메시지가 안 읽은 첫 메시지
        for(let j=i+1;j<chatMessages.length;j++){
          if(!isMyMessage(chatMessages[j])){ firstUnreadIdx=j; break; }
        }
        break;
      }
    }
  }

  chatMessages.forEach((m,idx)=>{
    // 검색 필터: 검색어 있으면 매칭 메시지만
    if(searchTerm && !m.text.toLowerCase().includes(searchTerm)) return;

    const d=new Date(m.time);
    const dateStr=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
    if(dateStr!==lastDate){
      html+=`<div class="chat-date-divider" data-date="${dateStr}"><span>${dateStr}</span></div>`;
      lastDate=dateStr;
    }
    if(idx===firstUnreadIdx && !searchTerm){
      html+=`<div class="chat-read-divider">여기까지 읽었습니다</div>`;
    }
    const timeStr=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const mine=isMyMessage(m);
    const result=parseReservationText(m.text);
    let parsedHtml='';
    if(!result.error){
      const rd=new Date(result.dateKey+'T00:00:00');
      const registered = registeredMsgIds.has(m.id) || isAlreadyReserved(result);
      parsedHtml=`<div class="chat-msg-parsed">
        <div class="chat-parsed-info">📋 <b>${rd.getMonth()+1}/${rd.getDate()}</b> ${escapeHtml(displayTime(result.timeLabel))} · <b><u>${escapeHtml(result.name)}</u></b> <b>${escapeHtml(displayPeople(result.people))}</b> ${result.table?'· <b>'+escapeHtml(result.table)+'</b>':''} ${result.memo?'· '+escapeHtml(result.memo):''}</div>
        ${registered
          ? `<button class="chat-register-btn done">✓ 등록됨</button>`
          : `<button class="chat-register-btn" onclick='doRegisterFromChatById(${m.id})'>예약 등록</button>`}
      </div>`;
    }
    // 검색어 하이라이트
    let textHtml=escapeHtml(m.text);
    if(searchTerm){
      const re=new RegExp('('+searchTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      textHtml=textHtml.replace(re,'<mark style="background:var(--am-dim);color:var(--am)">$1</mark>');
    }
    // 답장 인용 (이 메시지가 다른 메시지에 답장한 경우)
    let quoteHtml='';
    if(m.replyTo){
      const orig=chatMessages.find(x=>x.id===m.replyTo);
      if(orig){
        quoteHtml=`<div class="chat-quote"><div class="chat-quote-sender">${escapeHtml(orig.sender)}</div><div class="chat-quote-text">${escapeHtml(orig.text.slice(0,40))}</div></div>`;
      }
    }
    html+=`<div class="chat-msg ${mine?'mine':''}" data-date="${dateStr}" data-id="${m.id}" data-sender="${escapeHtml(m.sender)}">
      ${!mine?`<div class="chat-msg-sender">${escapeHtml(m.sender)}</div>`:''}
      ${quoteHtml}
      <div class="chat-msg-text">${textHtml}</div>
      <div class="chat-msg-time">${timeStr}</div>
      ${parsedHtml}
    </div>`;
  });
  if(searchTerm && !html){
    html='<div style="text-align:center;color:#918981;font-size:13px;padding:40px 0">검색 결과가 없어요</div>';
  }
  box.innerHTML=html;
  attachSwipeReply();
}

// 읽음 처리: 마지막 메시지를 읽음으로 표시
function markAsRead(){
  if(chatMessages.length){
    lastReadId=chatMessages[chatMessages.length-1].id;
    try{localStorage.setItem('sangmuok_lastread',String(lastReadId));}catch{}
    SangmuokDB.markRead(lastReadId);
  }
}

function doRegisterFromChatById(msgId){
  const m=chatMessages.find(x=>x.id===msgId);
  if(!m) return;
  const result=parseReservationText(m.text);
  if(result.error) return;
  // 이미 등록된 예약이면 중복 방지
  if(isAlreadyReserved(result)){
    registeredMsgIds.add(msgId);
    renderChat();
    return;
  }
  doRegisterFromChat(msgId,result);
}

// 같은 예약이 이미 등록돼 있는지 확인 (날짜+시간+이름+인원 일치)
function isAlreadyReserved(result){
  const list=(reservations[result.dateKey]||{})[result.slot]||[];
  return list.some(r=>
    r.time===result.timeLabel &&
    r.name===result.name &&
    String(r.people)===String(result.people)
  );
}

function escapeHtml(s){
  return String(s??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// 엔터 처리: 모바일은 줄바꿈, PC는 Enter 전송 (Shift+Enter 줄바꿈)
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
(function(){
  const ci=document.getElementById('chat-input');
  if(ci){
    ci.addEventListener('keydown',e=>{
      // PC에서만 Enter 전송, 모바일은 기본 줄바꿈 동작 유지
      if(!IS_MOBILE && e.key==='Enter' && !e.shiftKey){
        e.preventDefault();

      }
    });
    ci.addEventListener('input',()=>{
      ci.style.height='auto';
      ci.style.height=Math.min(ci.scrollHeight,120)+'px';
    });

})();

// 전송 버튼 터치 처리: SVG/아이콘 선이 아니라 버튼 원 전체 + 좌표 보정으로 전송
(function(){
  const btn=document.getElementById('chat-send-btn');
  const input=document.getElementById('chat-input');
  if(!btn) return;

  let sendingLock=false;

  function isPointInsideButton(e){
    const p = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    if(!p || typeof p.clientX !== 'number') return false;
    const r = btn.getBoundingClientRect();
    // 실제 버튼보다 조금 넓게 잡아서 갤럭시/크롬 주소창/키보드 상태에서 터치 오차 보정
    const pad = 14;
    return p.clientX >= r.left - pad && p.clientX <= r.right + pad &&
           p.clientY >= r.top - pad && p.clientY <= r.bottom + pad;
  }

  function triggerSend(e){
    if(e){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    }
    if(sendingLock) return false;
    sendingLock=true;
    sendChat();
    // 전송 후에도 입력창 포커스를 다시 잡아 키보드가 내려가는 현상 완화
    setTimeout(()=>{
      try{ input && input.focus({preventScroll:true}); }catch(_e){ try{ input && input.focus(); }catch(_e2){} }
      sendingLock=false;
    },250);
    return false;
  }

  // 1순위: 문서 캡처 단계에서 버튼 좌표 안 터치를 먼저 잡음
  // 일부 갤럭시에서 SVG 선/가운데 부분이 실제 button click으로 전달되지 않는 문제를 우회
  if(window.PointerEvent){
    document.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse' && e.button!==0) return;
      if(isPointInsideButton(e)) triggerSend(e);
    },{passive:false,capture:true});
  }

  document.addEventListener('touchstart',function(e){
    if(isPointInsideButton(e)) triggerSend(e);
  },{passive:false,capture:true});

  // 2순위: 버튼 자체 이벤트도 유지
  ['pointerdown','mousedown','click'].forEach(type=>{
    btn.addEventListener(type,function(e){
      if(type==='pointerdown' && e.pointerType==='mouse' && e.button!==0) return;
      triggerSend(e);
    },{passive:false,capture:true});
  });

  // 접근성: 스페이스/엔터로도 전송
  btn.addEventListener('keydown',function(e){
    if(e.key==='Enter' || e.key===' '){
      triggerSend(e);
    }
  });
})();

function reservationFloor(reservation){
  const table=String(reservation.table||'').trim();
  if(/2\s*층/.test(table)||table.includes('홀')) return 2;
  const numbers=assignedTableNumbers(table);
  return numbers.some(number=>number>=51) ? 2 : 1;
}

function exportExcel(dateKey=currentDateKey,selectedPages=['am-1','am-2','pm-1','pm-2']){
  const data=reservations[dateKey]||{am:[],pm:[]};
  const d=new Date(dateKey+'T00:00:00');
  const days=['일','월','화','수','목','금','토'];
  const dateLabel=`${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;

  // 예약 행 + 빈 행(수기용) 생성
  function buildRows(list, totalRows){
    let html='';
    list.forEach(r=>{
      html+=`<tr>
        <td>${escapeHtml(r.table)}</td>
        <td class="print-time">${escapeHtml(displayTime(r.time))}</td>
        <td class="print-name">${escapeHtml(r.name)}</td>
        <td class="print-people" style="text-align:center">${escapeHtml(displayPeople(r.people))}</td>
        <td>${escapeHtml(r.memo)}</td>
      </tr>`;
    });
    // 남은 빈 줄 (수기 작성용)
    const blanks=Math.max(totalRows-list.length, 3);
    for(let i=0;i<blanks;i++){
      html+=`<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>`;
    }
    return html;
  }

  const pageData=[
    {key:'am-1',title:'오전 · 1층',hours:'11:00~15:59',list:data.am.filter(r=>reservationFloor(r)===1)},
    {key:'am-2',title:'오전 · 2층',hours:'11:00~15:59',list:data.am.filter(r=>reservationFloor(r)===2)},
    {key:'pm-1',title:'오후 · 1층',hours:'16:00~21:00',list:data.pm.filter(r=>reservationFloor(r)===1)},
    {key:'pm-2',title:'오후 · 2층',hours:'16:00~21:00',list:data.pm.filter(r=>reservationFloor(r)===2)}
  ].filter(page=>selectedPages.includes(page.key));
  const pages=pageData.map(page=>`
    <div class="page">
      <div class="head"><div class="title">${dateLabel} · ${page.title}</div><div class="sub">상무옥 예약 (${page.hours}) · ${page.list.length}건</div></div>
      <table>
        <colgroup><col class="c-table"><col class="c-time"><col class="c-name"><col class="c-people"><col class="c-memo"></colgroup>
        <thead><tr><th>테이블</th><th>시간</th><th>성함</th><th>인원수</th><th>특이사항</th></tr></thead>
        <tbody>${buildRows(page.list,18)}</tbody>
      </table>
    </div>`).join('');

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${dateLabel} 예약</title>
  <style>
    @page{size:A4 portrait;margin:10mm;}
    *{box-sizing:border-box;}
    body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;margin:0;color:#000;}
    .page{page-break-after:always;}
    .page:last-child{page-break-after:auto;}

// ── 캘린더 ────────────────────────────────────────────
let calYear, calMonth;

function openCalendar(){
  const d=new Date(currentDateKey+'T00:00:00');
  calYear=d.getFullYear(); calMonth=d.getMonth();
  renderCalendar();
  document.getElementById('cal-overlay').classList.add('show');
  document.getElementById('cal-popup').style.display='block';
}
function closeCalendar(){
  document.getElementById('cal-overlay').classList.remove('show');
  document.getElementById('cal-popup').style.display='none';
}
function calChangeMonth(delta){
  calMonth+=delta;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
function goToday(){
  const d=new Date();
  currentDateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  updateDateLabel();render();closeCalendar();
}
function selectCalDay(dateKey){
  currentDateKey=dateKey;
  updateDateLabel();render();closeCalendar();
}
function renderCalendar(){
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-title').textContent=`${calYear}년 ${months[calMonth]}`;
  const days=['일','월','화','수','목','금','토'];
  const today=todayKey();
  let html=days.map((d,i)=>`<div class="cal-dow${i===0?' sun':i===6?' sat':''}">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const last=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<first;i++) html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=last;d++){
    const key=`${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const dow=(first+d-1)%7;
    const hasRes=reservations[key]&&((reservations[key].am||[]).length+(reservations[key].pm||[]).length)>0;
    const isSel=key===currentDateKey;
    const isToday=key===today;
    const dowCls=dow===0?' sun-col':dow===6?' sat-col':'';
    html+=`<div class="cal-day${isSel?' selected':isToday?' today':''}${hasRes?' has-reservation':''}${dowCls}" onclick="selectCalDay('${key}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}

// ── 자동 새로고침 (실시간 동기화) ──────────────────────
let autoSyncPaused=false;

function isUserTyping(){
  const a=document.activeElement;
  if(!a) return false;
  return a.tagName==='TEXTAREA' || a.tagName==='INPUT';
}

async function autoSync(){
  // 입력 중이거나 저장 중이면 건너뜀
  if(isUserTyping() || isSyncing || autoSyncPaused) return;
  // 캘린더 열려있으면 건너뜀
  if(document.getElementById('cal-popup').style.display!=='none') return;
  if(!currentUser) return;

  try{
    const newRes=await SangmuokDB.loadReservations();
    // 변경 있을 때만 갱신 (화면 깜빡임 최소화)
    const changed=JSON.stringify(newRes)!==JSON.stringify(reservations);
    if(changed){
      reservations=newRes;
      try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
      if(currentTab!=='chat') render();
      typeof renderCalendar==='function' && renderCalendar();
    }
  }catch(e){}

  // 채팅도 갱신
  if(currentTab==='chat'){
    try{
      const loaded=await SangmuokDB.loadMessages();
      const newChats=loaded.filter(c=>!deletedChatIds.has(String(c.id)));
      if(JSON.stringify(newChats)!==JSON.stringify(chatMessages)){
        const box=document.getElementById('chat-messages');
        const atBottom=box && (box.scrollHeight-box.scrollTop-box.clientHeight<60);
        chatMessages=newChats;
        try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
        renderChat();
        if(atBottom) scrollChatBottom();
      }
    }catch(e){}
  }
}

// ── 알림 기능 ─────────────────────────────────────────
let prevResCount = countAllReservations();
let prevChatCount = 0;

function countAllReservations(){
  let n=0;
  Object.values(reservations).forEach(s=>{n+=(s.am||[]).length+(s.pm||[]).length;});
  return n;
}

function saveNotificationSettings(){
  try{localStorage.setItem('sangmuok_notification_settings',JSON.stringify(notificationSettings));}catch{}
}

function syncNotificationControls(){
  const enabled=document.getElementById('notify-enabled');
  const sound=document.getElementById('notify-sound');
  if(enabled) enabled.checked=notificationSettings.enabled;
  if(sound) sound.value=notificationSettings.sound;
}

async function changeNotificationSetting(enabled){
  notificationSettings.enabled=Boolean(enabled);
  saveNotificationSettings();
  try{
    if(enabled){
      const permission=await requestNotifyPermission();
      if(permission!=='granted'){
        notificationSettings.enabled=false;
        saveNotificationSettings();
        syncNotificationControls();
        showBanner('브라우저 알림 권한을 허용해야 합니다');
        return;
      }
      await ensurePushSubscription();
    }else{
      await removePushSubscription();
    }
  }catch(error){
    console.error(error);
    notificationSettings.enabled=false;
    saveNotificationSettings();
    syncNotificationControls();
    showBanner('백그라운드 알림 설정에 실패했습니다');
    return;
  }
  showBanner(enabled?'예약톡 알림을 켰습니다':'예약톡 알림을 껐습니다');
}

function changeNotificationSound(sound){
  notificationSettings.sound=sound;
  saveNotificationSettings();
  if(sound!=='none') playNotifySound(sound,true);
}

function testNotificationSound(){
  if(notificationSettings.sound==='none'){
    showBanner('현재 알림음은 무음입니다');
    return;
  }
  playNotifySound(notificationSettings.sound,true);
}

// 알림음 (웹오디오로 생성 - 외부 파일 불필요)
function playNotifySound(sound=notificationSettings.sound,force=false){
  if((!notificationSettings.enabled&&!force)||sound==='none') return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const patterns={
      dingdong:[[880,0,.3],[1175,.12,.28]],
      soft:[[523,0,.18],[659,.16,.16]],
      bell:[[1047,0,.22],[1319,.09,.18],[1568,.18,.14]]
    };
    (patterns[sound]||patterns.dingdong).forEach(([freq,delay,volume])=>{
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=freq;
      o.type=sound==='bell'?'triangle':'sine';
      const t=ctx.currentTime+delay;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(volume,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.01,t+0.25);
      o.start(t);o.stop(t+0.3);
    });
    setTimeout(()=>ctx.close().catch(()=>{}),800);
  }catch(e){}
}

// 화면 알림 (브라우저 알림 권한 있으면 팝업, 없으면 화면 배너)
function showNotification(title, body, options={}){
  if(!notificationSettings.enabled) return;
  playNotifySound();
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title,{body, icon:'./icon-192.png', tag:'sangmuok'}); }catch(e){}
  }
  if(options.banner!==false) showBanner(title+' '+body);
}

function showBanner(text){
  let b=document.getElementById('notify-banner');
  if(!b){
    b=document.createElement('div');
    b.id='notify-banner';
    b.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;box-shadow:0 8px 24px rgba(51,67,57,.22);max-width:90%;text-align:center;transition:opacity .3s,top .3s;cursor:pointer;';
    b.onclick=()=>{b.style.opacity='0';};
    document.body.appendChild(b);
  }
  b.textContent='🔔 '+text;
  b.style.opacity='1';
  b.style.top='12px';
  clearTimeout(b._timer);
  b._timer=setTimeout(()=>{b.style.opacity='0';},4000);
}

// 알림 권한 요청 (사용자 첫 클릭 시)
async function requestNotifyPermission(){
  if('Notification' in window && Notification.permission==='default'){
    return Notification.requestPermission();
  }
  return 'Notification' in window?Notification.permission:'unsupported';
}

function urlBase64ToUint8Array(value){
  const padding='='.repeat((4-value.length%4)%4);
  const base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(char=>char.charCodeAt(0)));
}

async function ensurePushSubscription(){
  if(!currentUser||!('serviceWorker' in navigator)||!('PushManager' in window)) return;
  if(Notification.permission!=='granted') return;
  const registration=await navigator.serviceWorker.ready;
  let subscription=await registration.pushManager.getSubscription();
  if(!subscription){
    subscription=await registration.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(SANGMUOK_CONFIG.vapidPublicKey)
    });
  }
  await SangmuokDB.savePushSubscription(subscription);
}

async function removePushSubscription(){
  if(!('serviceWorker' in navigator)) return;
  const registration=await navigator.serviceWorker.ready;
  const subscription=await registration.pushManager.getSubscription();
  if(!subscription) return;
  try{await SangmuokDB.deletePushSubscription(subscription.endpoint);}catch(error){console.warn(error);}
  await subscription.unsubscribe();
}

syncNotificationControls();

// autoSync 후 새 항목 감지해서 알림
const _origAutoSync = autoSync;
autoSync = async function(){
  const beforeCounts={};
  Object.entries(reservations).forEach(([dateKey,slots])=>{
    beforeCounts[`${dateKey}:am`]=(slots.am||[]).length;
    beforeCounts[`${dateKey}:pm`]=(slots.pm||[]).length;
  });
  await _origAutoSync();
  // 예약 증가 감지
  const nowRes=countAllReservations();
  if(nowRes>prevResCount && prevResCount>=0){
    let risk=null;
    Object.keys(reservations).forEach(dateKey=>{
      ['am','pm'].forEach(slot=>{
        const count=(reservations[dateKey]?.[slot]||[]).length;
        if(count<=(beforeCounts[`${dateKey}:${slot}`]||0)) return;
        const status=capacityStatus(dateKey,slot);
        if(status.ratio>=.7&&(!risk||status.ratio>risk.status.ratio)) risk={dateKey,slot,status};
      });
    });
    if(risk) showCapacityRisk(risk.dateKey,risk.slot);
    else showNotification('새 예약', `예약이 ${nowRes-prevResCount}건 추가됐어요`);
  }
  prevResCount=nowRes;
  // 채팅 증가 감지
  if(chatMessages.length>prevChatCount && prevChatCount>0){
    const last=chatMessages[chatMessages.length-1];
    if(!isMyMessage(last)){
      showNotification(last.sender, last.text.slice(0,30));
    }
  }
  prevChatCount=chatMessages.length;
};

// 초기 채팅 카운트 세팅
setTimeout(()=>{prevChatCount=chatMessages.length;prevResCount=countAllReservations();},3000);
