<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상무옥 예약관리</title>
<style>
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;
  --am:#d4a853;--am-dim:#2a200a;--pm:#5b8fd4;--pm-dim:#0a1528;
  --text:#e8e8e8;--text-dim:#888;--accent:#e85d4a;--green:#52c87a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}

/* 헤더 */
header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:100;}
.logo{font-size:17px;font-weight:700;}
.logo span{color:var(--am);}
.date-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.date-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.date-nav button:active{background:var(--surface2);}
#current-date-label{font-size:13px;font-weight:600;min-width:100px;text-align:center;}

/* 탭 */
.tabs{display:flex;padding:10px 16px 0;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;border-bottom:none;color:var(--text-dim);background:transparent;white-space:nowrap;touch-action:manipulation;}
.tab.am.active{background:var(--am-dim);border-color:var(--am);color:var(--am);}
.tab.pm.active{background:var(--pm-dim);border-color:var(--pm);color:var(--pm);}
.tab.map.active{background:#1a1a2e;border-color:#a78bfa;color:#a78bfa;}
.tab.chat.active{background:#0a2818;border-color:var(--green);color:var(--green);}
.tab-badge{display:inline-block;background:var(--surface2);border-radius:10px;padding:1px 6px;font-size:11px;margin-left:5px;font-family:'DM Mono',monospace;}
.tab.am.active .tab-badge{background:var(--am);color:#000;}
.tab.pm.active .tab-badge{background:var(--pm);color:#000;}

/* ── 채팅 패널 ── */
.chat-panel{flex:1;display:none;flex-direction:column;height:100%;}
.chat-panel.active{display:flex;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-date-divider{text-align:center;font-size:11px;color:var(--text-dim);margin:8px 0;}
.chat-date-divider span{background:var(--surface2);padding:3px 12px;border-radius:10px;}
.chat-msg{max-width:75%;align-self:flex-start;background:var(--surface2);border-radius:4px 14px 14px 14px;padding:10px 13px;position:relative;}
.chat-msg.mine{align-self:flex-end;background:#2a3f2f;border-radius:14px 4px 14px 14px;}
.chat-msg-sender{font-size:11px;color:var(--am);font-weight:700;margin-bottom:3px;}
.chat-msg.mine .chat-msg-sender{color:var(--green);}
.chat-msg-text{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.chat-msg-time{font-size:9px;color:var(--text-dim);margin-top:4px;text-align:right;}
.chat-msg-parsed{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;}
.chat-parsed-info{color:var(--text-dim);line-height:1.6;}
.chat-parsed-info b{color:var(--text);}
.chat-register-btn{margin-top:6px;background:var(--green);color:#000;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;width:100%;font-family:'Noto Sans KR',sans-serif;}
.chat-register-btn.done{background:var(--surface);color:var(--text-dim);cursor:default;}
.chat-input-bar{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:var(--bg);}
.chat-input-bar textarea{flex:1;height:auto;min-height:42px;max-height:120px;font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.4;padding:10px 12px;}
.chat-send-btn{background:var(--green);color:#000;border:none;border-radius:10px;width:46px;height:42px;font-size:18px;cursor:pointer;flex-shrink:0;touch-action:manipulation;}
.chat-sender-select{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);align-items:center;}
.chat-sender-select span{font-size:11px;color:var(--text-dim);}
.chat-sender-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.chat-sender-btn.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700;}
.chat-auto-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);cursor:pointer;}


/* 메인 레이아웃 */
.main{display:flex;height:calc(100vh - 105px);}

/* ── 입력 패널 (오전/오후 탭에서만 표시) ── */
.input-panel{width:260px;min-width:260px;border-right:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.input-panel.hidden{display:none;}
.panel-title{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;line-height:1.7;padding:12px;resize:none;height:140px;width:100%;outline:none;}
textarea:focus{border-color:#555;}
textarea::placeholder{color:#444;}
.preview-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px;font-size:12px;min-height:72px;}
.preview-box .pv-row{display:flex;justify-content:space-between;padding:2px 0;}
.preview-box .pv-label{color:var(--text-dim);}
.preview-box .pv-val{font-weight:500;font-family:'DM Mono',monospace;}
.pv-time-am{color:var(--am);}.pv-time-pm{color:var(--pm);}
.preview-box .empty{color:#444;font-size:12px;text-align:center;padding:12px 0;}
.preview-error{color:var(--accent);font-size:12px;padding:4px 0;}
.btn-add{background:var(--green);color:#000;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;}
.btn-add:disabled{background:var(--surface2);color:var(--text-dim);cursor:not-allowed;}
.hint{font-size:11px;color:#555;line-height:1.8;border-top:1px solid var(--border);padding-top:10px;}
.hint strong{color:#777;display:block;margin-bottom:3px;}

/* ── 예약 리스트 ── */
.table-panel{flex:1;overflow-y:auto;padding:18px 20px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.section-dot{width:8px;height:8px;border-radius:50%;}
.section-dot.am{background:var(--am);}.section-dot.pm{background:var(--pm);}
.section-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.section-title.am{color:var(--am);}.section-title.pm{color:var(--pm);}
.section-count{font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:24px;}
thead th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid #1e1e1e;}
tbody td{padding:9px 10px;vertical-align:middle;}
.td-time{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;}
.td-time.am{color:var(--am);}.td-time.pm{color:var(--pm);}
.td-name{font-weight:500;}
.td-people{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-dim);}
.td-memo{font-size:12px;color:var(--text-dim);}
.btn-del{background:none;border:none;color:#3a3a3a;cursor:pointer;font-size:14px;padding:4px 6px;border-radius:4px;}
.btn-del:hover{color:var(--accent);}
.empty-state{text-align:center;padding:48px 0;color:#444;font-size:13px;}
.empty-state .emoji{font-size:32px;display:block;margin-bottom:12px;opacity:.4;}
.summary-bar{display:flex;gap:16px;margin-bottom:12px;padding:8px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border);font-size:12px;}
.summary-bar span{color:var(--text-dim);}
.summary-bar strong{color:var(--text);font-family:'DM Mono',monospace;}
.td-table-input{background:transparent;border:none;border-bottom:1px solid #333;color:var(--text-dim);font-family:'DM Mono',monospace;font-size:12px;width:60px;padding:2px 4px;outline:none;}
.td-table-input:focus{border-bottom-color:#666;color:var(--text);}

/* ── 배치도 패널 ── */
.map-panel{flex:1;overflow-y:auto;padding:20px 24px;display:none;}
.map-panel.active{display:block;}

/* 범례 */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding:10px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

/* 층 섹션 */
.floor-section{margin-bottom:24px;}
.floor-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#a78bfa;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.floor-label::after{content:'';flex:1;height:1px;background:#2a2a3e;}

/* 구역 레이아웃 */
.floor-zones{display:flex;flex-direction:column;gap:12px;}

/* 구역 행 */
.zone-row{display:flex;gap:12px;align-items:flex-start;}
.zone-group{display:flex;flex-direction:column;gap:4px;}
.zone-name{font-size:9px;font-weight:700;letter-spacing:1px;color:#555;text-transform:uppercase;text-align:center;margin-bottom:4px;}

/* 룸 안 테이블 쌍 */
.room-box{background:#181818;border:1px solid #2a2a2a;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;}
.room-box.window-room{background:#141e14;border-color:#1e2e1e;}
.room-box.room-h{flex-direction:row;}

/* 구분선 (룸 사이 간격) */
.zone-gap{width:20px;flex-shrink:0;}
.zone-divider{width:1px;background:#2a2a2a;align-self:stretch;margin:0 4px;}

/* 테이블 셀 */
.tbl-cell{
  border-radius:6px;padding:6px 5px;
  width:62px;height:62px;
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  cursor:pointer;transition:all .15s;border:1px solid transparent;overflow:hidden;
  position:relative;
}
@media(max-width:600px){.tbl-cell{width:50px;height:50px;padding:4px 3px;}}
.tbl-cell:active{filter:brightness(1.2);}
.tbl-cell.vacant{background:var(--surface2);border-color:var(--border);}
.tbl-cell.booked-am{background:rgba(212,168,83,.15);border-color:var(--am);}
.tbl-cell.booked-pm{background:rgba(91,143,212,.15);border-color:var(--pm);}
.tbl-cell.booked-both{background:linear-gradient(135deg,rgba(212,168,83,.2) 50%,rgba(91,143,212,.2) 50%);border-color:#c084fc;}
.tbl-num{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--text-dim);line-height:1;margin-bottom:2px;}
.tbl-cell.booked-am .tbl-num{color:var(--am);}
.tbl-cell.booked-pm .tbl-num{color:var(--pm);}
.tbl-cell.booked-both .tbl-num{color:#c084fc;}
.booking-chip{font-size:9px;line-height:1.3;text-align:center;width:100%;padding:1px 2px;border-radius:2px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip-am{background:rgba(212,168,83,.2);color:var(--am);}
.chip-pm{background:rgba(91,143,212,.2);color:var(--pm);}

/* 모바일 탭 상세 (탭 클릭 시 나오는 팝업) */
.mobile-popup{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#1e1e1e;border-top:1px solid #3a3a3a;border-radius:16px 16px 0 0;
  padding:20px;z-index:500;max-height:60vh;overflow-y:auto;
}
.mobile-popup.show{display:block;}
.popup-handle{width:36px;height:4px;background:#444;border-radius:2px;margin:0 auto 16px;}
.popup-title{font-size:14px;font-weight:700;color:#a78bfa;margin-bottom:12px;font-family:'DM Mono',monospace;}
.popup-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #2a2a2a;font-size:13px;align-items:center;}
.popup-time-am{color:var(--am);font-weight:700;font-family:'DM Mono',monospace;min-width:48px;}
.popup-time-pm{color:var(--pm);font-weight:700;font-family:'DM Mono',monospace;min-width:48px;}
.popup-name{font-weight:500;}
.popup-people{color:var(--text-dim);font-size:12px;margin-left:auto;}
.popup-memo{color:#666;font-size:11px;}
.popup-close{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:10px;margin-top:14px;font-size:13px;cursor:pointer;touch-action:manipulation;}
/* 캘린더 팝업 */
.cal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);}
.cal-overlay.show{display:block;}
.cal-popup{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:#1a1a1a;border:1px solid #3a3a3a;border-radius:14px;
  padding:18px;z-index:201;width:310px;
  box-shadow:0 16px 48px rgba(0,0,0,.7);
}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-size:14px;font-weight:700;color:var(--text);}
.cal-nav{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{font-size:10px;font-weight:700;text-align:center;color:var(--text-dim);padding:4px 0;}
.cal-dow.sun{color:#e85d4a;}.cal-dow.sat{color:var(--pm);}
.cal-day{
  font-size:12px;font-family:'DM Mono',monospace;
  text-align:center;padding:6px 2px;border-radius:6px;cursor:pointer;
  color:var(--text-dim);transition:all .1s;
}
.cal-day:hover{background:var(--surface2);color:var(--text);}
.cal-day.today{color:var(--am);font-weight:700;}
.cal-day.selected{background:var(--am);color:#000;font-weight:700;}
.cal-day.has-reservation{position:relative;}
.cal-day.has-reservation::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--green);}
.cal-day.empty{cursor:default;pointer-events:none;}
.cal-day.sun-col{color:#c84a4a;}
.cal-day.sat-col{color:#4a7ac8;}
.cal-today-btn{width:100%;margin-top:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.cal-today-btn:hover{color:var(--text);}
</style>

</head>
<body>

<header>
  <div class="logo">상무<span>옥</span></div>
  <div class="date-nav">
    <button onclick="changeDate(-1)">‹</button>
    <span id="current-date-label" onclick="openCalendar()" style="cursor:pointer;border-bottom:1px dashed #555;padding-bottom:1px"></span>
    <button onclick="changeDate(1)">›</button>
  </div>
  <button onclick="exportExcel()" style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0 12px;height:30px;cursor:pointer;font-size:12px;margin-left:8px">🖨 프린트</button>
</header>

<!-- 캘린더 오버레이 -->
<div class="cal-overlay" id="cal-overlay" onclick="closeCalendar()"></div>
<div class="cal-popup" id="cal-popup">
  <div class="cal-header">
    <button class="cal-nav" onclick="calChangeMonth(-1)">‹</button>
    <div class="cal-title" id="cal-title"></div>
    <button class="cal-nav" onclick="calChangeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <button class="cal-today-btn" onclick="goToday()">오늘로 이동</button>
</div>

<div class="tabs">
  <div class="tab am active" onclick="switchTab('am')">🌅 오전 <span class="tab-badge" id="badge-am">0</span></div>
  <div class="tab pm" onclick="switchTab('pm')">🌇 오후 <span class="tab-badge" id="badge-pm">0</span></div>
  <div class="tab map" onclick="switchTab('map')">🗺 배치도</div>
  <div class="tab chat" onclick="switchTab('chat')">💬 예약톡</div>
</div>

<div class="main">
  <!-- 입력 패널 -->
  <div class="input-panel" id="input-panel">
    <div class="panel-title">예약 입력</div>
    <textarea id="kakao-input" placeholder="카톡 예약 붙여넣기&#10;&#10;금요일&#10;12시&#10;5.2명&#10;이종&#10;룸" oninput="parseInput()"></textarea>
    <div class="preview-box" id="preview"><div class="empty">입력하면 미리보기</div></div>
    <button class="btn-add" id="btn-add" onclick="addReservation()" disabled>예약 추가</button>
    <div class="hint">
      <strong>입력 형식</strong>
      요일 또는 날짜 (생략 시 오늘)<br>
      시간: 12시, 12:30, 오후1시<br>
      인원: 5명, 5.2명, 5/2명<br>
      예약자명 / 메모
    </div>
  </div>

  <!-- 예약 리스트 -->
  <div class="table-panel" id="table-panel"></div>

  <!-- 배치도 -->
  <div class="map-panel" id="map-panel"></div>

  <!-- 예약톡 -->
  <div class="chat-panel" id="chat-panel">
    <div class="chat-sender-select">
      <span>입력자:</span>
      <div id="sender-btns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <label class="chat-auto-toggle"><input type="checkbox" id="auto-register" checked> 자동등록</label>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-bar">
      <textarea id="chat-input" placeholder="예약 입력 (예: 금 6시 4명 홍길동 1룸)" rows="1"></textarea>
      <button class="chat-send-btn" onclick="sendChat()">↑</button>
    </div>
  </div>
</div>

<!-- 모바일 팝업 -->
<div class="mobile-popup" id="mobile-popup" onclick="event.stopPropagation()">
  <div class="popup-handle"></div>
  <div class="popup-title" id="popup-title"></div>
  <div id="popup-body"></div>
  <button class="popup-close" onclick="closePopup()">닫기</button>
</div>
<div id="popup-overlay" style="display:none;position:fixed;inset:0;z-index:499;" onclick="closePopup()"></div>

<script>
// ── 상태 ─────────────────────────────────────────────
const API_URL = 'https://script.google.com/macros/s/AKfycby-OujA8mLz7J1ObFicx50J-i1NI4fDFw0rt0Ru4SKrsf7XKeJV2k-Dm16shxrKiA4V/exec';

let currentTab='am', currentDateKey=todayKey(), reservations={}, parsed=null;
let isSyncing=false;

function todayKey(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function pad(n){return String(n).padStart(2,'0');}

// ── 구글 시트 연동 ────────────────────────────────────
function showSyncStatus(msg, color='#888'){
  let el=document.getElementById('sync-status');
  if(!el){
    el=document.createElement('div');
    el.id='sync-status';
    el.style.cssText='position:fixed;bottom:16px;right:16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px 14px;font-size:12px;z-index:999;transition:opacity .3s;';
    document.body.appendChild(el);
  }
  el.style.color=color;
  el.textContent=msg;
  el.style.opacity='1';
  if(color==='#52c87a') setTimeout(()=>{el.style.opacity='0';},2000);
}

async function loadFromSheet(){
  showSyncStatus('불러오는 중...');
  try{
    const res = await fetch(API_URL + '?t=' + Date.now());
    const json = await res.json();
    reservations = {};
    (json.data || []).forEach(raw => {
      const row = {};
      Object.keys(raw).forEach(k => row[k.toLowerCase()] = raw[k]);

      const dateKey = String(row.datekey || '').trim();
      const slot = String(row.slot || '').trim();
      if(!dateKey || !slot) return;

      let timeH = Number(row.timeh);
      let timeStr = String(row.time || '');
      let mm = 0;
      if(/^\d{1,2}:\d{2}/.test(timeStr)){
        const parts = timeStr.split(':');
        timeH = Number(parts[0]);
        mm = Number(parts[1]);
      } else if(timeStr.includes('T')){
        const d = new Date(timeStr);
        if(!isNaN(d)) mm = d.getUTCMinutes();
      }
      if(isNaN(timeH)) timeH = 12;
      const timeLabel = `${pad(timeH)}:${pad(mm)}`;

      if(!reservations[dateKey]) reservations[dateKey] = {am:[], pm:[]};
      reservations[dateKey][slot].push({
        id: Number(row.id),
        time: timeLabel,
        timeH: timeH,
        name: String(row.name || ''),
        people: String(row.people || ''),
        memo: String(row.memo || ''),
        table: String(row.table || '')
      });
    });
    Object.values(reservations).forEach(s=>{
      s.am.sort((a,b)=>a.time.localeCompare(b.time));
      s.pm.sort((a,b)=>a.time.localeCompare(b.time));
    });
    showSyncStatus('✓ 동기화 완료', '#52c87a');
  } catch(e) {
    try{const c=localStorage.getItem('sangmuok_v2');if(c)reservations=JSON.parse(c);}catch{}
    showSyncStatus('오프라인 모드', '#d4a853');
  }
  render();
  typeof renderCalendar === 'function' && renderCalendar();
}

async function saveToSheet(){
  if(isSyncing) return;
  isSyncing=true;
  showSyncStatus('저장 중...');
  // 로컬 캐시에도 저장
  try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
  try{
    const rows=[];
    Object.entries(reservations).forEach(([dateKey,slots])=>{
      ['am','pm'].forEach(slot=>{
        (slots[slot]||[]).forEach(r=>{
          rows.push({id:r.id,dateKey,slot,time:r.time,timeH:r.timeH,name:r.name,people:r.people,memo:r.memo,table:r.table});
        });
      });
    });
    await fetch(API_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'save',rows}),
    });
    showSyncStatus('✓ 저장 완료','#52c87a');
  }catch(e){
    showSyncStatus('✓ 로컬 저장됨','#d4a853');
  }
  isSyncing=false;
}

// ── 파싱 ─────────────────────────────────────────────
const DAY_MAP={'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':0};
function parseTimeStr(str){
  let pm=false,am=false;
  if(str.includes('오후')){pm=true;str=str.replace('오후','').trim();}
  if(str.includes('오전')){am=true;str=str.replace('오전','').trim();}

  // N분뒤/후
  const minLater=str.match(/^(\d+)\s*분\s*(뒤|후)$/);
  if(minLater){
    const now=new Date();
    now.setMinutes(now.getMinutes()+parseInt(minLater[1]));
    return{h:now.getHours(),m:now.getMinutes()};
  }

  // N시간뒤/후
  const hrLater=str.match(/^(\d+)\s*시간\s*(뒤|후)$/);
  if(hrLater){
    const now=new Date();
    now.setHours(now.getHours()+parseInt(hrLater[1]));
    return{h:now.getHours(),m:now.getMinutes()};
  }

  let h,m=0;

  // 6시30분, 6시 30분
  const hm2=str.match(/^(\d{1,2})\s*시\s*(\d{1,2})\s*분$/);
  if(hm2){h=parseInt(hm2[1]);m=parseInt(hm2[2]);}
  // 6시반
  else if(/^(\d{1,2})\s*시\s*반$/.test(str)){h=parseInt(str.match(/^(\d{1,2})/)[1]);m=30;}
  // 6시
  else if(/^(\d{1,2})\s*시$/.test(str)){h=parseInt(str.match(/^(\d{1,2})/)[1]);}
  // 12:30
  else{
    const hm=str.match(/^(\d{1,2}):(\d{2})/);
    if(hm){h=parseInt(hm[1]);m=parseInt(hm[2]);}
    else{const ho=str.match(/^(\d{1,2})/);if(!ho)return null;h=parseInt(ho[1]);}
  }

  if(pm&&h<12)h+=12;
  if(am&&h===12)h=0;
  // 오전 명시 없고 1~9시면 오후로 처리
  if(!am&&!pm&&h>=1&&h<=9)h+=12;
  return{h,m};
}
// 텍스트 → 예약 객체 파싱 (성공시 객체, 실패시 {error})
function parseReservationText(raw){
  if(!raw||!raw.trim()) return {error:'빈 입력'};
  const lines=raw.split(/\n/).map(l=>l.trim()).filter(Boolean);
  // 한 줄 입력도 지원: 공백으로 분리
  let workLines = lines;
  if(lines.length===1 && lines[0].includes(' ')){
    workLines = lines[0].split(/\s+/);
  }
  let dateKey=currentDateKey,timeStr=null,name=null,people=null,memo=[];
  const remainLines=[];
  for(const line of workLines){
    if(/^오늘$/.test(line)){dateKey=currentDateKey;continue;}
    if(/^(내일|낼)$/.test(line)){
      const d=new Date(currentDateKey+'T00:00:00');d.setDate(d.getDate()+1);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    if(/^모레$/.test(line)){
      const d=new Date(currentDateKey+'T00:00:00');d.setDate(d.getDate()+2);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    const nextWeekMatch=line.match(/^(다음\s*주|담주)\s*([월화수목금토일])요?일?$/);
    if(nextWeekMatch){
      const dow=DAY_MAP[nextWeekMatch[2]];
      const d=new Date(currentDateKey+'T00:00:00');
      let diff=dow-d.getDay();if(diff<=0)diff+=7;diff+=7;
      d.setDate(d.getDate()+diff);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    if(/^[월화수목금토일]요?일?$/.test(line)){
      const dow=DAY_MAP[line[0]];const d=new Date(currentDateKey+'T00:00:00');
      let diff=dow-d.getDay();if(diff<0)diff+=7;
      d.setDate(d.getDate()+diff);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    const dm=line.match(/^(\d{1,2})[\/월](\d{1,2})일?$/);
    if(dm){dateKey=`${new Date().getFullYear()}-${dm[1].padStart(2,'0')}-${dm[2].padStart(2,'0')}`;continue;}
    if(!timeStr&&/\d/.test(line)&&(line.includes('시')||line.includes(':')||line.includes('분뒤')||line.includes('분후')||line.includes('시간뒤')||line.includes('시간후'))){timeStr=line;continue;}
    if(!people&&/^[\d.\/+]+명?$/.test(line)){people=line.replace('명','');continue;}
    remainLines.push(line);
  }
  if(remainLines.length>=1){
    name=remainLines[0];
    if(remainLines.length>=2) memo=remainLines.slice(1);
  }
  const errors=[];
  if(!timeStr)errors.push('시간');
  if(!name)errors.push('예약자명');
  let timeObj=null;
  if(timeStr){timeObj=parseTimeStr(timeStr);if(!timeObj)errors.push('시간형식');else if(timeObj.h<11||timeObj.h>=22)errors.push('시간범위(11~21시)');}
  if(errors.length) return {error:errors.join('·')+' 필요'};
  const slot=timeObj.h<16?'am':'pm';
  const timeLabel=`${pad(timeObj.h)}:${pad(timeObj.m)}`;
  return {dateKey,timeLabel,timeH:timeObj.h,name,people:people||'',memo:memo.join(' '),slot};
}

function parseInput(){
  const raw=document.getElementById('kakao-input').value.trim();

// ── 룸 → 테이블 매핑 ─────────────────────────────────
const ROOM_MAP = {
  '1룸':[31,32], '2룸':[33,34], '3룸':[35,36],
  '5룸':[41,42], '6룸':[43,44], '7룸':[45,46], '8룸':[47,48],
  '2층5룸':[51,52,53,54,55,56], '2층6룸':[61,62,63,64],
  '2층7룸':[71,72,73,74,75,76], '홀':[81,82,83,84],
  '창가1':[1,2], '창가2':[3,4], '창가3':[5,6], '창가4':[7,8],
};

// 테이블 값 → 룸명 변환 (배치도 표시용)
function resolveTableLabel(val){
  if(!val) return '';
  const v = val.trim();
  // 숫자면 그대로
  if(/^\d+$/.test(v)) return v;
  // 룸 이름이면 첫 번째 테이블 번호 반환 (배치도 매칭용)
  for(const [room, tables] of Object.entries(ROOM_MAP)){
    if(v===room) return String(tables[0]);
  }
  return v;
}

// 배치도에서 테이블 번호 매칭 (룸명 포함)
// 배치도에서 테이블 번호 매칭 (룸명, T접미사 포함)
function tableMatches(tableVal, tNum){
  const t=String(tableVal).trim();
  if(!t) return false;
  // 룸 이름 매칭
  for(const [room,tables] of Object.entries(ROOM_MAP)){
    if(t===room && tables.includes(tNum)) return true;
  }
  // 숫자만 추출해서 비교 (41T, 41 t, T41 등 모두 41로)
  const nums = t.match(/\d+/g);
  if(nums && nums.map(Number).includes(tNum)) return true;
  return false;
}

function getBookings(tNum){
  const data=reservations[currentDateKey]||{am:[],pm:[]};
  return{
    am:data.am.filter(r=>tableMatches(r.table,tNum)),
    pm:data.pm.filter(r=>tableMatches(r.table,tNum))
  };
}
function cellClass(tNum){
  const b=getBookings(tNum);
  if(b.am.length&&b.pm.length)return'booked-both';
  if(b.am.length)return'booked-am';
  if(b.pm.length)return'booked-pm';
  return'vacant';
}

// ── 테이블 셀 HTML ────────────────────────────────────
function tblHTML(num){
  const b=getBookings(num);
  const cls=cellClass(num);
  let chips='';
  b.am.forEach(r=>{chips+=`<div class="booking-chip chip-am">${r.time} ${r.name}</div>`;});
  b.pm.forEach(r=>{chips+=`<div class="booking-chip chip-pm">${r.time} ${r.name}</div>`;});
  return`<div class="tbl-cell ${cls}" onclick="showTableDetail(${num})">
    <div class="tbl-num">${num}</div>${chips}
  </div>`;
}

  const panel=document.getElementById('table-panel');
  const cc=currentTab;
  const slotLabel=cc==='am'?'오전 (11:00~15:59)':'오후 (16:00~21:00)';
  let totalPeople=0;
  list.forEach(r=>{r.people.split(/[\/+\.]/).map(n=>parseInt(n)).filter(n=>!isNaN(n)).forEach(n=>totalPeople+=n);});
  if(!list.length){
    panel.innerHTML=`<div class="section-header"><div class="section-dot ${cc}"></div><div class="section-title ${cc}">${slotLabel}</div></div><div class="empty-state"><span class="emoji">📋</span>예약 없음</div>`;
    return;
  }
  const rows=list.map(r=>`<tr>
    <td class="td-time ${cc}">${r.time}</td>
    <td class="td-name">${r.name}</td>
    <td class="td-people">${r.people?r.people+'명':'-'}</td>
    <td><input class="td-table-input" value="${r.table}" placeholder="미배정" onchange="updateTable('${currentDateKey}','${cc}',${r.id},this.value)" onclick="event.stopPropagation()"></td>
    <td class="td-memo">${r.memo||''}</td>
    <td><button class="btn-del" onclick="deleteRow('${currentDateKey}','${cc}',${r.id})">✕</button></td>
  </tr>`).join('');
  panel.innerHTML=`
    <div class="section-header"><div class="section-dot ${cc}"></div><div class="section-title ${cc}">${slotLabel}</div><span class="section-count">${list.length}건</span></div>
    <div class="summary-bar"><div><span>예약 </span><strong>${list.length}건</strong></div><div><span>총 인원 </span><strong>약 ${totalPeople}명</strong></div></div>
    <table><thead><tr><th>시간</th><th>예약자</th><th>인원</th><th>테이블</th><th>메모</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── 채팅 (예약톡) ─────────────────────────────────────
let chatMessages = [];
let senderList = loadSenderList();
let currentSender = senderList[0] || '홀';
let registeredMsgIds = new Set();

function loadSenderList(){
  try{const s=localStorage.getItem('sangmuok_senders');if(s)return JSON.parse(s);}catch{}
  return ['홀','사장','주방'];
}
function saveSenderList(){
  try{localStorage.setItem('sangmuok_senders',JSON.stringify(senderList));}catch{}
}

function renderSenderButtons(){
  const wrap=document.getElementById('sender-btns');
  if(!wrap) return;
  wrap.innerHTML = senderList.map(s=>
    `<button class="chat-sender-btn ${s===currentSender?'active':''}" onclick="setSender('${s.replace(/'/g,"\\'")}')" ondblclick="editSender('${s.replace(/'/g,"\\'")}')">${escapeHtml(s)}</button>`
  ).join('') + `<button class="chat-sender-btn" style="color:#666" onclick="addSender()">+</button>`;
}

function setSender(s){
  currentSender=s;
  renderSenderButtons();
}

function addSender(){
  const name=prompt('입력자 이름 추가:');
  if(name&&name.trim()){
    senderList.push(name.trim());
    saveSenderList();
    currentSender=name.trim();
    renderSenderButtons();
  }
}

function editSender(old){
  const name=prompt('입력자 이름 수정 (비우면 삭제):', old);
  if(name===null) return;
  const idx=senderList.indexOf(old);
  if(idx<0) return;
  if(name.trim()===''){
    if(senderList.length<=1){alert('최소 1명은 필요해요');return;}
    senderList.splice(idx,1);
    if(currentSender===old) currentSender=senderList[0];
  }else{
    senderList[idx]=name.trim();
    if(currentSender===old) currentSender=name.trim();
  }
  saveSenderList();
  renderSenderButtons();
}

async function loadChats(){
  try{
    const res=await fetch(API_URL+'?type=chats&t='+Date.now());
    const json=await res.json();
    chatMessages=(json.chats||[]).map(c=>({id:Number(c.id),time:String(c.time),sender:String(c.sender),text:String(c.text)}));
  }catch(e){
    try{const c=localStorage.getItem('sangmuok_chats');if(c)chatMessages=JSON.parse(c);}catch{}
  }
  renderChat();
}

async function saveChat(msg){
  chatMessages.push(msg);
  try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
  try{
    await fetch(API_URL,{
      method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'saveChat',chat:msg})
    });
  }catch(e){}
}

function scrollChatBottom(){
  const el=document.getElementById('chat-messages');
  if(el) setTimeout(()=>{el.scrollTop=el.scrollHeight;},50);
}

async function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text) return;
  const now=new Date();
  const msg={id:Date.now(),time:now.toISOString(),sender:currentSender,text};
  input.value='';
  input.style.height='auto';

  await saveChat(msg);
  renderChat();
  scrollChatBottom();

  // 파싱 시도
  const result=parseReservationText(text);
  if(!result.error){
    const auto=document.getElementById('auto-register').checked;
    if(auto){
      doRegisterFromChat(msg.id,result);
    }
  }
}

function doRegisterFromChat(msgId,result){
  if(registeredMsgIds.has(msgId)) return;
  const key=result.dateKey;
  if(!reservations[key])reservations[key]={am:[],pm:[]};
  reservations[key][result.slot].push({id:Date.now()+Math.random(),time:result.timeLabel,timeH:result.timeH,name:result.name,people:result.people,memo:result.memo,table:''});
  reservations[key][result.slot].sort((a,b)=>a.time.localeCompare(b.time));
  registeredMsgIds.add(msgId);
  saveToSheet();
  renderChat();
}

function renderChat(){
  const box=document.getElementById('chat-messages');
  if(!box) return;
  if(!chatMessages.length){
    box.innerHTML='<div style="text-align:center;color:#444;font-size:13px;padding:40px 0">아직 메시지가 없어요.<br>예약을 입력해보세요.</div>';
    return;
  }
  const days=['일','월','화','수','목','금','토'];
  let html='', lastDate='';
  chatMessages.forEach(m=>{
    const d=new Date(m.time);
    const dateStr=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
    if(dateStr!==lastDate){
      html+=`<div class="chat-date-divider"><span>${dateStr}</span></div>`;
      lastDate=dateStr;
    }
    const timeStr=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const mine=(m.sender===currentSender);
    const result=parseReservationText(m.text);
    let parsedHtml='';
    if(!result.error){
      const rd=new Date(result.dateKey+'T00:00:00');
      const registered=registeredMsgIds.has(m.id);
      parsedHtml=`<div class="chat-msg-parsed">
        <div class="chat-parsed-info">📋 <b>${rd.getMonth()+1}/${rd.getDate()}</b> ${result.timeLabel} · <b>${result.name}</b> ${result.people?result.people+'명':''} ${result.memo?'· '+result.memo:''}</div>
        ${registered
          ? `<button class="chat-register-btn done">✓ 등록됨</button>`
          : `<button class="chat-register-btn" onclick='doRegisterFromChatById(${m.id})'>예약 등록</button>`}
      </div>`;
    }
    html+=`<div class="chat-msg ${mine?'mine':''}">
      ${!mine?`<div class="chat-msg-sender">${m.sender}</div>`:''}
      <div class="chat-msg-text">${escapeHtml(m.text)}</div>
      <div class="chat-msg-time">${timeStr}</div>
      ${parsedHtml}
    </div>`;
  });
  box.innerHTML=html;
}

function doRegisterFromChatById(msgId){
  const m=chatMessages.find(x=>x.id===msgId);
  if(!m) return;
  const result=parseReservationText(m.text);
  if(!result.error) doRegisterFromChat(msgId,result);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 엔터로 전송 (Shift+Enter는 줄바꿈)
document.addEventListener('DOMContentLoaded',()=>{});
(function(){
  const ci=document.getElementById('chat-input');
  if(ci){
    ci.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
    });
    ci.addEventListener('input',()=>{
      ci.style.height='auto';
      ci.style.height=Math.min(ci.scrollHeight,120)+'px';
    });
  }
})();

// ── 프린트 (A4 예약지) ────────────────────────────────
function exportExcel(){
  const data=reservations[currentDateKey]||{am:[],pm:[]};
  const d=new Date(currentDateKey+'T00:00:00');
  const days=['일','월','화','수','목','금','토'];
  const dateLabel=`${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;

  // 예약 행 + 빈 행(수기용) 생성
  function buildRows(list, totalRows){
    let html='';
    list.forEach(r=>{
      html+=`<tr>
        <td>${r.table||''}</td>
        <td>${r.time||''}</td>
        <td>${r.name||''}</td>
        <td style="text-align:center">${r.people||''}</td>
        <td>${r.memo||''}</td>
      </tr>`;
    });
    // 남은 빈 줄 (수기 작성용)
    const blanks=Math.max(totalRows-list.length, 3);
    for(let i=0;i<blanks;i++){
      html+=`<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>`;
    }
    return html;
  }

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${dateLabel} 예약</title>
  <style>
    @page{size:A4 portrait;margin:10mm;}
    *{box-sizing:border-box;}
    body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;margin:0;color:#000;}
    .page{page-break-after:always;}
    .page:last-child{page-break-after:auto;}
    .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px;}
    .head .title{font-size:20px;font-weight:bold;}
    .head .sub{font-size:13px;}
    table{width:100%;border-collapse:collapse;table-layout:fixed;}
    th,td{border:1px solid #000;padding:0;height:30px;font-size:13px;padding:2px 6px;vertical-align:middle;}
    th{background:#e8e8e8;text-align:center;font-weight:bold;height:26px;}
    col.c-table{width:20%;} col.c-time{width:15%;} col.c-name{width:25%;} col.c-people{width:13%;} col.c-memo{width:27%;}
    td{overflow:hidden;white-space:nowrap;}
    .toolbar{padding:10px;text-align:center;}
    @media print{.toolbar{display:none;}}
    .btn{padding:8px 24px;font-size:14px;cursor:pointer;margin:0 4px;}
  </style></head><body>
  <div class="toolbar">
    <button class="btn" onclick="window.print()">🖨 프린트</button>
    <button class="btn" onclick="window.close()">닫기</button>
  </div>

  <div class="page">
    <div class="head"><div class="title">${dateLabel} · 오전</div><div class="sub">상무옥 예약 (11:00~15:59) · ${data.am.length}건</div></div>
    <table>
      <colgroup><col class="c-table"><col class="c-time"><col class="c-name"><col class="c-people"><col class="c-memo"></colgroup>
      <thead><tr><th>테이블</th><th>시간</th><th>성함</th><th>인원수</th><th>특이사항</th></tr></thead>
      <tbody>${buildRows(data.am, 26)}</tbody>
    </table>
  </div>

  <div class="page">
    <div class="head"><div class="title">${dateLabel} · 오후</div><div class="sub">상무옥 예약 (16:00~21:00) · ${data.pm.length}건</div></div>
    <table>
      <colgroup><col class="c-table"><col class="c-time"><col class="c-name"><col class="c-people"><col class="c-memo"></colgroup>
      <thead><tr><th>테이블</th><th>시간</th><th>성함</th><th>인원수</th><th>특이사항</th></tr></thead>
      <tbody>${buildRows(data.pm, 26)}</tbody>
    </table>
  </div>
  </body></html>`;

  const w=window.open('','_blank');
  w.document.write(html);
  w.document.close();
}

// ── 초기화 ────────────────────────────────────────────
updateDateLabel();
render(); // 먼저 화면 표시
loadFromSheet(); // 이후 시트 동기화
loadChats(); // 채팅 불러오기
renderSenderButtons(); // 입력자 버튼

// ── 캘린더 ────────────────────────────────────────────
let calYear, calMonth;

function openCalendar(){
  const d=new Date(currentDateKey+'T00:00:00');
  calYear=d.getFullYear(); calMonth=d.getMonth();
  renderCalendar();
  document.getElementById('cal-overlay').classList.add('show');
  document.getElementById('cal-popup').style.display='block';
}
function closeCalendar(){
  document.getElementById('cal-overlay').classList.remove('show');
  document.getElementById('cal-popup').style.display='none';
}
function calChangeMonth(delta){
  calMonth+=delta;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
function goToday(){
  const d=new Date();
  currentDateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  updateDateLabel();render();closeCalendar();
}
function selectCalDay(dateKey){
  currentDateKey=dateKey;
  updateDateLabel();render();closeCalendar();
}
function renderCalendar(){
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-title').textContent=`${calYear}년 ${months[calMonth]}`;
  const days=['일','월','화','수','목','금','토'];
  const today=todayKey();
  let html=days.map((d,i)=>`<div class="cal-dow${i===0?' sun':i===6?' sat':''}">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const last=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<first;i++) html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=last;d++){
    const key=`${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const dow=(first+d-1)%7;
    const hasRes=reservations[key]&&((reservations[key].am||[]).length+(reservations[key].pm||[]).length)>0;
    const isSel=key===currentDateKey;
    const isToday=key===today;
    const dowCls=dow===0?' sun-col':dow===6?' sat-col':'';
    html+=`<div class="cal-day${isSel?' selected':isToday?' today':''}${hasRes?' has-reservation':''}${dowCls}" onclick="selectCalDay('${key}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}
// 캘린더 팝업 초기 숨김
document.getElementById('cal-popup').style.display='none';
</script>
