<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>상무옥 예약관리</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="상무옥">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;
  --am:#d4a853;--am-dim:#2a200a;--pm:#5b8fd4;--pm-dim:#0a1528;
  --text:#e8e8e8;--text-dim:#888;--accent:#e85d4a;--green:#52c87a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}

/* 헤더 */
header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:100;}
.logo{font-size:17px;font-weight:700;}
.logo span{color:var(--am);}
.date-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.date-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.date-nav button:active{background:var(--surface2);}
#current-date-label{font-size:13px;font-weight:600;min-width:100px;text-align:center;}

/* 탭 */
.tabs{display:flex;padding:10px 16px 0;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;border-bottom:none;color:var(--text-dim);background:transparent;white-space:nowrap;touch-action:manipulation;}
.tab.am.active{background:var(--am-dim);border-color:var(--am);color:var(--am);}
.tab.pm.active{background:var(--pm-dim);border-color:var(--pm);color:var(--pm);}
.tab.map.active{background:#1a1a2e;border-color:#a78bfa;color:#a78bfa;}
.tab.chat.active{background:#0a2818;border-color:var(--green);color:var(--green);}
.tab-badge{display:inline-block;background:var(--surface2);border-radius:10px;padding:1px 6px;font-size:11px;margin-left:5px;font-family:'DM Mono',monospace;}
.tab.am.active .tab-badge{background:var(--am);color:#000;}
.tab.pm.active .tab-badge{background:var(--pm);color:#000;}

/* ── 채팅 패널 ── */
.chat-panel{flex:1;display:none;flex-direction:column;height:100%;position:relative;}
.chat-panel.active{display:flex;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-date-divider{text-align:center;font-size:11px;color:var(--text-dim);margin:8px 0;}
.chat-date-divider span{background:var(--surface2);padding:3px 12px;border-radius:10px;}
/* 스크롤 시 상단 떠있는 날짜 */
.chat-floating-date{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(40,40,40,.92);color:#ddd;font-size:11px;padding:4px 14px;border-radius:12px;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s;backdrop-filter:blur(4px);}
.chat-floating-date.show{opacity:1;}
/* 읽음 구분선 */
.chat-read-divider{display:flex;align-items:center;gap:8px;margin:6px 0;color:#e85d4a;font-size:11px;}
.chat-read-divider::before,.chat-read-divider::after{content:'';flex:1;height:1px;background:rgba(232,93,74,.4);}
.chat-msg{max-width:75%;align-self:flex-start;background:var(--surface2);border-radius:4px 14px 14px 14px;padding:10px 13px;position:relative;transition:transform .15s;touch-action:pan-y;}
.chat-msg.mine{align-self:flex-end;background:#2a3f2f;border-radius:14px 4px 14px 14px;}
/* 답장 인용 (메시지 안) */
.chat-quote{border-left:3px solid var(--am);padding:4px 8px;margin-bottom:6px;background:rgba(255,255,255,.05);border-radius:4px;font-size:12px;}
.chat-quote-sender{color:var(--am);font-weight:700;font-size:10px;}
.chat-quote-text{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 답장 화살표 (스와이프 시 나타남) */
.chat-reply-hint{position:absolute;left:-30px;top:50%;transform:translateY(-50%);color:var(--am);font-size:18px;opacity:0;transition:opacity .15s;}
/* 입력창 위 답장 미리보기 바 */
.reply-bar{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--surface2);border-top:1px solid var(--border);font-size:12px;}
.reply-bar.show{display:flex;}
.reply-bar-info{flex:1;min-width:0;}
.reply-bar-sender{color:var(--am);font-weight:700;font-size:11px;}
.reply-bar-text{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar-close{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:0 4px;}
.chat-msg-sender{font-size:11px;color:var(--am);font-weight:700;margin-bottom:3px;}
.chat-msg.mine .chat-msg-sender{color:var(--green);}
.chat-msg-text{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.chat-msg-time{font-size:9px;color:var(--text-dim);margin-top:4px;text-align:right;}
.chat-msg-parsed{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;}
.chat-parsed-info{color:var(--text-dim);line-height:1.6;}
.chat-parsed-info b{color:var(--text);}
.chat-register-btn{margin-top:6px;background:var(--green);color:#000;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;width:100%;font-family:'Noto Sans KR',sans-serif;}
.chat-register-btn.done{background:var(--surface);color:var(--text-dim);cursor:default;}
.chat-input-bar{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:var(--bg);}
.chat-input-bar textarea{flex:1;height:auto;min-height:42px;max-height:120px;font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.4;padding:10px 12px;}
.chat-send-btn{background:var(--green);color:#000;border:none;border-radius:10px;width:46px;height:42px;font-size:18px;cursor:pointer;flex-shrink:0;touch-action:manipulation;}
.chat-sender-select{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.chat-sender-select span{font-size:11px;color:var(--text-dim);}
.chat-sender-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.chat-sender-btn.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700;}
.chat-auto-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);cursor:pointer;}

/* 예약 입력 플로팅 버튼 */
.fab-add{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#000;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:90;display:none;align-items:center;justify-content:center;line-height:1;}
.fab-add.show{display:flex;}
/* 입력 바텀시트 오버레이 */
.input-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;}
.input-overlay.show{display:block;}
.input-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;z-index:301;padding:18px 18px 28px;transform:translateY(100%);transition:transform .25s;max-height:85vh;overflow-y:auto;}
.input-sheet.show{transform:translateY(0);}
.input-sheet-handle{width:40px;height:4px;background:#444;border-radius:2px;margin:0 auto 16px;}


/* 메인 레이아웃 */
.main{display:flex;height:calc(100vh - 105px);}

/* ── 입력 패널 (오전/오후 탭에서만 표시) ── */
.input-panel{width:260px;min-width:260px;border-right:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.input-panel.hidden{display:none;}
.panel-title{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;line-height:1.7;padding:12px;resize:none;height:140px;width:100%;outline:none;}
textarea:focus{border-color:#555;}
textarea::placeholder{color:#444;}
.preview-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px;font-size:12px;min-height:72px;}
.preview-box .pv-row{display:flex;justify-content:space-between;padding:2px 0;}
.preview-box .pv-label{color:var(--text-dim);}
.preview-box .pv-val{font-weight:500;font-family:'DM Mono',monospace;}
.pv-time-am{color:var(--am);}.pv-time-pm{color:var(--pm);}
.preview-box .empty{color:#444;font-size:12px;text-align:center;padding:12px 0;}
.preview-error{color:var(--accent);font-size:12px;padding:4px 0;}
.btn-add{background:var(--green);color:#000;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;}
.btn-add:disabled{background:var(--surface2);color:var(--text-dim);cursor:not-allowed;}
.hint{font-size:11px;color:#555;line-height:1.8;border-top:1px solid var(--border);padding-top:10px;}
.hint strong{color:#777;display:block;margin-bottom:3px;}

/* ── 예약 리스트 ── */
.table-panel{flex:1;overflow-y:auto;padding:18px 20px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.section-dot{width:8px;height:8px;border-radius:50%;}
.section-dot.am{background:var(--am);}.section-dot.pm{background:var(--pm);}
.section-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.section-title.am{color:var(--am);}.section-title.pm{color:var(--pm);}
.section-count{font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:24px;}
thead th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid #1e1e1e;}
tbody td{padding:9px 10px;vertical-align:middle;}
.td-time{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;}
.td-time.am{color:var(--am);}.td-time.pm{color:var(--pm);}
.td-name{font-weight:500;}
.td-people{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-dim);}
.td-memo{font-size:12px;color:var(--text-dim);}
.btn-del{background:none;border:none;color:#3a3a3a;cursor:pointer;font-size:14px;padding:4px 6px;border-radius:4px;}
.btn-del:hover{color:var(--accent);}
.empty-state{text-align:center;padding:48px 0;color:#444;font-size:13px;}
.empty-state .emoji{font-size:32px;display:block;margin-bottom:12px;opacity:.4;}
.summary-bar{display:flex;gap:16px;margin-bottom:12px;padding:8px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border);font-size:12px;}
.summary-bar span{color:var(--text-dim);}
.summary-bar strong{color:var(--text);font-family:'DM Mono',monospace;}
.td-table-input{background:transparent;border:none;border-bottom:1px solid #333;color:var(--text-dim);font-family:'DM Mono',monospace;font-size:12px;width:60px;padding:2px 4px;outline:none;}
.td-table-input:focus{border-bottom-color:#666;color:var(--text);}

/* ── 배치도 패널 ── */
.map-panel{flex:1;overflow-y:auto;padding:20px 24px;display:none;}
.map-panel.active{display:block;}

/* 범례 */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding:10px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

/* 층 섹션 */
.floor-section{margin-bottom:24px;}
.floor-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#a78bfa;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.floor-label::after{content:'';flex:1;height:1px;background:#2a2a3e;}

/* 구역 레이아웃 */
.floor-zones{display:flex;flex-direction:column;gap:12px;}

/* 구역 행 */
.zone-row{display:flex;gap:12px;align-items:flex-start;}
.zone-group{display:flex;flex-direction:column;gap:4px;}
.zone-name{font-size:9px;font-weight:700;letter-spacing:1px;color:#555;text-transform:uppercase;text-align:center;margin-bottom:4px;}

/* 룸 안 테이블 쌍 */
.room-box{background:#181818;border:1px solid #2a2a2a;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;}
.room-box.window-room{background:#141e14;border-color:#1e2e1e;}
.room-box.room-h{flex-direction:row;}

/* 구분선 (룸 사이 간격) */
.zone-gap{width:20px;flex-shrink:0;}
.zone-divider{width:1px;background:#2a2a2a;align-self:stretch;margin:0 4px;}

/* 테이블 셀 */
.tbl-cell{
  border-radius:6px;padding:6px 5px;
  width:62px;height:62px;
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  cursor:pointer;transition:all .15s;border:1px solid transparent;overflow:hidden;
  position:relative;
}
@media(max-width:600px){.tbl-cell{width:50px;height:50px;padding:4px 3px;}}
.tbl-cell:active{filter:brightness(1.2);}
.tbl-cell.vacant{background:var(--surface2);border-color:var(--border);}
.tbl-cell.booked-am{background:rgba(212,168,83,.15);border-color:var(--am);}
.tbl-cell.booked-pm{background:rgba(91,143,212,.15);border-color:var(--pm);}
.tbl-cell.booked-both{background:linear-gradient(135deg,rgba(212,168,83,.2) 50%,rgba(91,143,212,.2) 50%);border-color:#c084fc;}
.tbl-num{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--text-dim);line-height:1;margin-bottom:2px;}
.tbl-cell.booked-am .tbl-num{color:var(--am);}
.tbl-cell.booked-pm .tbl-num{color:var(--pm);}
.tbl-cell.booked-both .tbl-num{color:#c084fc;}
.booking-chip{font-size:9px;line-height:1.3;text-align:center;width:100%;padding:1px 2px;border-radius:2px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip-am{background:rgba(212,168,83,.2);color:var(--am);}
.chip-pm{background:rgba(91,143,212,.2);color:var(--pm);}

/* 모바일 탭 상세 (탭 클릭 시 나오는 팝업) */
.mobile-popup{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#1e1e1e;border-top:1px solid #3a3a3a;border-radius:16px 16px 0 0;
  padding:20px;z-index:500;max-height:60vh;overflow-y:auto;
}
.mobile-popup.show{display:block;}
.popup-handle{width:36px;height:4px;background:#444;border-radius:2px;margin:0 auto 16px;}
.popup-title{font-size:14px;font-weight:700;color:#a78bfa;margin-bottom:12px;font-family:'DM Mono',monospace;}
.popup-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #2a2a2a;font-size:13px;align-items:center;}
.popup-time-am{color:var(--am);font-weight:700;font-family:'DM Mono',monospace;min-width:48px;}
.popup-time-pm{color:var(--pm);font-weight:700;font-family:'DM Mono',monospace;min-width:48px;}
.popup-name{font-weight:500;}
.popup-people{color:var(--text-dim);font-size:12px;margin-left:auto;}
.popup-memo{color:#666;font-size:11px;}
.popup-close{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:10px;margin-top:14px;font-size:13px;cursor:pointer;touch-action:manipulation;}
/* 캘린더 팝업 */
.cal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);}
.cal-overlay.show{display:block;}
.cal-popup{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:#1a1a1a;border:1px solid #3a3a3a;border-radius:14px;
  padding:18px;z-index:201;width:310px;
  box-shadow:0 16px 48px rgba(0,0,0,.7);
}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-size:14px;font-weight:700;color:var(--text);}
.cal-nav{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{font-size:10px;font-weight:700;text-align:center;color:var(--text-dim);padding:4px 0;}
.cal-dow.sun{color:#e85d4a;}.cal-dow.sat{color:var(--pm);}
.cal-day{
  font-size:12px;font-family:'DM Mono',monospace;
  text-align:center;padding:6px 2px;border-radius:6px;cursor:pointer;
  color:var(--text-dim);transition:all .1s;
}
.cal-day:hover{background:var(--surface2);color:var(--text);}
.cal-day.today{color:var(--am);font-weight:700;}
.cal-day.selected{background:var(--am);color:#000;font-weight:700;}
.cal-day.has-reservation{position:relative;}
.cal-day.has-reservation::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--green);}
.cal-day.empty{cursor:default;pointer-events:none;}
.cal-day.sun-col{color:#c84a4a;}
.cal-day.sat-col{color:#4a7ac8;}
.cal-today-btn{width:100%;margin-top:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.cal-today-btn:hover{color:var(--text);}
</style>

</head>
<body>

<header>
  <div class="logo">상무<span>옥</span></div>
  <div class="date-nav">
    <button onclick="changeDate(-1)">‹</button>
    <span id="current-date-label" onclick="openCalendar()" style="cursor:pointer;border-bottom:1px dashed #555;padding-bottom:1px"></span>
    <button onclick="changeDate(1)">›</button>
  </div>
  <button onclick="exportExcel()" style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0 12px;height:30px;cursor:pointer;font-size:12px;margin-left:8px">🖨 프린트</button>
</header>

<!-- 캘린더 오버레이 -->
<div class="cal-overlay" id="cal-overlay" onclick="closeCalendar()"></div>
<div class="cal-popup" id="cal-popup">
  <div class="cal-header">
    <button class="cal-nav" onclick="calChangeMonth(-1)">‹</button>
    <div class="cal-title" id="cal-title"></div>
    <button class="cal-nav" onclick="calChangeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <button class="cal-today-btn" onclick="goToday()">오늘로 이동</button>
</div>

<div class="tabs">
  <div class="tab am active" onclick="switchTab('am')">🌅 오전 <span class="tab-badge" id="badge-am">0</span></div>
  <div class="tab pm" onclick="switchTab('pm')">🌇 오후 <span class="tab-badge" id="badge-pm">0</span></div>
  <div class="tab map" onclick="switchTab('map')">🗺 배치도</div>
  <div class="tab chat" onclick="switchTab('chat')">💬 예약톡</div>
</div>

<div class="main">
  <!-- 예약 입력 바텀시트 -->
  <div class="input-overlay" id="input-overlay" onclick="closeInputSheet()"></div>
  <div class="input-sheet" id="input-panel">
    <div class="input-sheet-handle"></div>
    <div class="panel-title">예약 입력</div>
    <textarea id="kakao-input" placeholder="카톡 예약 붙여넣기&#10;&#10;금요일&#10;12시&#10;5.2명&#10;이종&#10;룸" oninput="parseInput()"></textarea>
    <div class="preview-box" id="preview"><div class="empty">입력하면 미리보기</div></div>
    <button class="btn-add" id="btn-add" onclick="addReservation()" disabled>예약 추가</button>
    <div class="hint">
      <strong>입력 형식</strong>

<script>
// ── 상태 ─────────────────────────────────────────────
const API_URL = 'https://script.google.com/macros/s/AKfycbzMIn9nXkSpAKb_j4cMP2hq3di2fZu8Nrkqpe3CZk71vf-2m9YYMQdlUCEp9tYnYP7B/exec';

let currentTab='am', currentDateKey=todayKey(), reservations={}, parsed=null;
let isSyncing=false;

function todayKey(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function pad(n){return String(n).padStart(2,'0');}

// ── 구글 시트 연동 ────────────────────────────────────
function showSyncStatus(msg, color='#888'){
  let el=document.getElementById('sync-status');
  if(!el){
    el=document.createElement('div');
    el.id='sync-status';
    el.style.cssText='position:fixed;bottom:16px;right:16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px 14px;font-size:12px;z-index:999;transition:opacity .3s;';
    document.body.appendChild(el);
  }
  el.style.color=color;
  el.textContent=msg;
  el.style.opacity='1';
  if(color==='#52c87a') setTimeout(()=>{el.style.opacity='0';},2000);
}

async function loadFromSheet(){
  showSyncStatus('불러오는 중...');
  try{
    const res = await fetch(API_URL + '?t=' + Date.now());
    const json = await res.json();
    reservations = {};
    (json.data || []).forEach(raw => {
      const row = {};
      Object.keys(raw).forEach(k => row[k.toLowerCase()] = raw[k]);

      const dateKey = String(row.datekey || '').trim();
      const slot = String(row.slot || '').trim();
      if(!dateKey || !slot) return;

      let timeH = Number(row.timeh);
      let timeStr = String(row.time || '');
      let mm = 0;
      if(/^\d{1,2}:\d{2}/.test(timeStr)){
        const parts = timeStr.split(':');
        timeH = Number(parts[0]);
        mm = Number(parts[1]);
      } else if(timeStr.includes('T')){
        const d = new Date(timeStr);
        if(!isNaN(d)) mm = d.getUTCMinutes();
      }
      if(isNaN(timeH)) timeH = 12;
      const timeLabel = `${pad(timeH)}:${pad(mm)}`;

      if(!reservations[dateKey]) reservations[dateKey] = {am:[], pm:[]};
      reservations[dateKey][slot].push({
        id: Number(row.id),
        time: timeLabel,
        timeH: timeH,
        name: String(row.name || ''),
        people: String(row.people || ''),
        memo: String(row.memo || ''),
        table: String(row.table || '')
      });
    });
    Object.values(reservations).forEach(s=>{
      s.am.sort((a,b)=>a.time.localeCompare(b.time));
      s.pm.sort((a,b)=>a.time.localeCompare(b.time));
    });
    showSyncStatus('✓ 동기화 완료', '#52c87a');
  } catch(e) {
    try{const c=localStorage.getItem('sangmuok_v2');if(c)reservations=JSON.parse(c);}catch{}
    showSyncStatus('오프라인 모드', '#d4a853');
  }
  render();
  typeof renderCalendar === 'function' && renderCalendar();
}

async function saveToSheet(){
  if(isSyncing) return;
  isSyncing=true;
  showSyncStatus('저장 중...');
  // 로컬 캐시에도 저장
  try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
  try{
    const rows=[];
    Object.entries(reservations).forEach(([dateKey,slots])=>{
      ['am','pm'].forEach(slot=>{
        (slots[slot]||[]).forEach(r=>{
          rows.push({id:r.id, datekey:dateKey, dateKey:dateKey, slot, time:r.time, timeh:r.timeH, timeH:r.timeH, name:r.name, people:r.people, memo:r.memo, table:r.table});
        });
      });
    });
    await fetch(API_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'save',rows}),
    });
    showSyncStatus('✓ 저장 완료','#52c87a');
  }catch(e){
    showSyncStatus('✓ 로컬 저장됨','#d4a853');
  }
  isSyncing=false;
}

// ── 날짜 ─────────────────────────────────────────────
function changeDate(delta){
  const d=new Date(currentDateKey+'T00:00:00');
  d.setDate(d.getDate()+delta);
  currentDateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  updateDateLabel();render();
}
function updateDateLabel(){
  const d=new Date(currentDateKey+'T00:00:00');
  const days=['일','월','화','수','목','금','토'];
  document.getElementById('current-date-label').textContent=`${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
}

// ── 탭 ───────────────────────────────────────────────
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab.${tab}`).classList.add('active');
  const isMap=(tab==='map');
  const isChat=(tab==='chat');
  const isReservation=(tab==='am'||tab==='pm');
  document.getElementById('table-panel').style.display=(isMap||isChat)?'none':'';
  document.getElementById('map-panel').classList.toggle('active',isMap);
  document.getElementById('chat-panel').classList.toggle('active',isChat);
  // 예약 탭에서만 + 플로팅 버튼 표시
  document.getElementById('fab-add').classList.toggle('show',isReservation);
  if(!isReservation) closeInputSheet();
  if(isChat){ renderChat(); scrollChatBottom(); }
  else render();
}

// 예약 입력 바텀시트 열기/닫기
function openInputSheet(){
  document.getElementById('input-overlay').classList.add('show');
  document.getElementById('input-panel').classList.add('show');
  setTimeout(()=>document.getElementById('kakao-input').focus(),100);
}

  document.getElementById('input-overlay').classList.remove('show');
  document.getElementById('input-panel').classList.remove('show');
}

// ── 파싱 ─────────────────────────────────────────────
const DAY_MAP={'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':0};
function parseTimeStr(str){
  let pm=false,am=false;
  if(str.includes('오후')){pm=true;str=str.replace('오후','').trim();}
  if(str.includes('오전')){am=true;str=str.replace('오전','').trim();}
  // 조사 제거: "6시로", "6시에", "6시까지"
  str=str.replace(/시(로|에|까지|쯤|경)$/,'시').trim();

  // N분뒤/후
  const minLater=str.match(/^(\d+)\s*분\s*(뒤|후)$/);
  if(minLater){
    const now=new Date();
    now.setMinutes(now.getMinutes()+parseInt(minLater[1]));
    return{h:now.getHours(),m:now.getMinutes()};
  }

  // N시간뒤/후
  const hrLater=str.match(/^(\d+)\s*시간\s*(뒤|후)$/);
  if(hrLater){
    const now=new Date();
    now.setHours(now.getHours()+parseInt(hrLater[1]));
    return{h:now.getHours(),m:now.getMinutes()};
  }

  let h,m=0;

  // 6시30분, 6시 30분
  const hm2=str.match(/^(\d{1,2})\s*시\s*(\d{1,2})\s*분$/);
  // 12시30 (분 글자 없이 숫자만) - 카톡에서 가장 흔한 형태
  const hm3=str.match(/^(\d{1,2})\s*시\s*(\d{1,2})$/);
  if(hm2){h=parseInt(hm2[1]);m=parseInt(hm2[2]);}
  else if(hm3){h=parseInt(hm3[1]);m=parseInt(hm3[2]);}
  // 6시반
  else if(/^(\d{1,2})\s*시\s*반$/.test(str)){h=parseInt(str.match(/^(\d{1,2})/)[1]);m=30;}
  // 6시
  else if(/^(\d{1,2})\s*시$/.test(str)){h=parseInt(str.match(/^(\d{1,2})/)[1]);}
  // 12:30
  else{
    const hm=str.match(/^(\d{1,2}):(\d{2})/);
    if(hm){h=parseInt(hm[1]);m=parseInt(hm[2]);}
    else{const ho=str.match(/^(\d{1,2})/);if(!ho)return null;h=parseInt(ho[1]);}
  }

  if(pm&&h<12)h+=12;
  if(am&&h===12)h=0;
  // 오전 명시 없고 1~9시면 오후로 처리
  if(!am&&!pm&&h>=1&&h<=9)h+=12;
  return{h,m};
}
// 텍스트 → 예약 객체 파싱 (성공시 객체, 실패시 {error})
function parseReservationText(raw){
  if(!raw||!raw.trim()) return {error:'빈 입력'};
  // 흔한 오타 교정
  let normalized = raw
    // 오늘 변형: 오늫,오느,오눌,오늣,오늘르
    .replace(/오[느늘늗늘늣늩늫눌누][르을]?/g, '오늘')
    // 내일 변형: 내알,내얼,내읾,낼
    .replace(/내[일알얼읾]/g, '내일')
    .replace(/(^|\s)낼(\s|$)/g, '$1내일$2')
    // 모레 변형: 모래,모레,모레
    .replace(/모[레래]/g, '모레')
    // 요일 오타: 목용일,금용일 (요→용)
    .replace(/([월화수목금토일])용일/g, '$1요일')
    // 시 오타: 6시,6씨,6시 (씨→시)
    .replace(/(\d{1,2})\s*씨/g, '$1시')
    // 명 오타: 6명,6멍 (멍→명)
    .replace(/(\d+)\s*멍/g, '$1명')
    // 분 오타: 30푼,30뷴 (푼/뷴→분)
    .replace(/(\d{1,2})\s*[푼뷴]/g, '$1분');
  // 붙어있는 토큰 분리
  normalized = normalized
    .replace(/(\d{1,2}\s*시\s*\d{1,2}\s*분)(\d{1,2}\/?\d*명)/g, '$1 $2')
    .replace(/(\d{1,2}\s*시\s*반)(\d{1,2}\/?\d*명)/g, '$1 $2')
    .replace(/(\d{1,2}\s*시\s*\d{1,2})(명)/g, '$1$2')
    .replace(/(\d{1,2}\s*시)(\d{1,2}\/?\d*명)/g, '$1 $2')
    .replace(/(\d{1,2}:\d{2})(\d{1,2}\/?\d*명)/g, '$1 $2')
    .replace(/(명)(?=\S)/g, '$1 ');
  const lines=normalized.split(/\n/).map(l=>l.trim()).filter(Boolean);
  // 모든 줄을 공백 기준으로 토큰화 (한 줄에 여러 정보 있어도 분리)
  let workLines = [];
  lines.forEach(l=>{
    l.split(/\s+/).filter(Boolean).forEach(tok=>workLines.push(tok));
  });
  let dateKey=currentDateKey,timeStr=null,name=null,people=null,memo=[];
  const remainLines=[];
  const TODAY = todayKey(); // 실제 오늘 (보고 있는 날짜 아님)
  for(let li=0; li<workLines.length; li++){
    const line=workLines[li];
    if(/^오늘$/.test(line)){dateKey=TODAY;continue;}
    if(/^(내일|낼)$/.test(line)){
      const d=new Date(TODAY+'T00:00:00');d.setDate(d.getDate()+1);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    if(/^모레$/.test(line)){
      const d=new Date(TODAY+'T00:00:00');d.setDate(d.getDate()+2);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    const nextWeekMatch=line.match(/^(다음\s*주|담주)\s*([월화수목금토일])요?일?$/);
    if(nextWeekMatch){
      const dow=DAY_MAP[nextWeekMatch[2]];
      const d=new Date(TODAY+'T00:00:00');
      let diff=dow-d.getDay();if(diff<=0)diff+=7;diff+=7;
      d.setDate(d.getDate()+diff);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    if(/^[월화수목금토일]요?일?$/.test(line)){
      const dow=DAY_MAP[line[0]];const d=new Date(TODAY+'T00:00:00');
      let diff=dow-d.getDay();if(diff<0)diff+=7;
      d.setDate(d.getDate()+diff);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    const dm=line.match(/^(\d{1,2})[\/월](\d{1,2})일?$/);
    if(dm){dateKey=`${new Date().getFullYear()}-${dm[1].padStart(2,'0')}-${dm[2].padStart(2,'0')}`;continue;}
    // N일 단독 (예: "12일") - 이번 달 또는 다음 달 해당 일자
    const dayOnly=line.match(/^(\d{1,2})일$/);
    if(dayOnly){
      const day=parseInt(dayOnly[1]);
      const t=new Date(TODAY+'T00:00:00');
      let y=t.getFullYear(), mo=t.getMonth();
      // 오늘보다 이전 일자면 다음 달로
      if(day<t.getDate()) mo++;
      if(mo>11){mo=0;y++;}
      dateKey=`${y}-${pad(mo+1)}-${pad(day)}`;continue;
    }
    // 시간 토큰 (12시, 12시30, 12시30분, 12:30, 6시반)
    if(!timeStr && /^\d{1,2}\s*(시|:)/.test(line) || (!timeStr && /\d/.test(line) && (line.includes('분뒤')||line.includes('분후')||line.includes('시간뒤')||line.includes('시간후')))){
      timeStr=line;
      // 다음 토큰이 "30분" 또는 "30"(분단독)이면 시간에 흡수 (11시 30분 / 11시 30)
      if(li+1<workLines.length && /^\d{1,2}분?$/.test(workLines[li+1]) && line.includes('시') && !/\d시\d/.test(line) && !line.includes('분')){
        timeStr=line.replace(/분?$/,'')+workLines[li+1];
        li++;
      }
      continue;
    }
    // 인원 토큰: 5명, 5/1명, 5.1명, 5+1명 (점/슬래시/플러스 = 어른/유아 구분)
    if(!people && /^\d+[.\/+]?\d*\s*명$/.test(line)){
      people=line.replace('명','').replace(/[.+]/g,'/').trim();
      continue;
    }
    // 인원이 "명" 없이 앞에 시간/날짜 다 있고 숫자만 단독일 때 (드뭄) - 건너뜀
    remainLines.push(line);
  }
  // remainLines에서 메모성 단어와 이름 분리
  // 메모 키워드: 룸, 갈비, 홀, 한테이블, 유아의자, 대기, 취소, 변경, 도착 등
  const MEMO_KW=/룸|갈비|홀|한테이블|테이블|유아|아기|의자|대기|취소|변경|도착|예정|입금|어른|소인|일반\d|매운\d|번방|예약/;
  if(remainLines.length>=1){
    // 첫 줄이 메모 키워드면 이름이 따로 없을 수 있음 → 이름은 키워드 아닌 첫 줄
    let nameIdx=remainLines.findIndex(l=>!MEMO_KW.test(l) && !/^\d/.test(l));
    if(nameIdx<0) nameIdx=0;
    name=remainLines[nameIdx];
    memo=remainLines.filter((_,i)=>i!==nameIdx);
  }
  const errors=[];
  if(!timeStr)errors.push('시간');
  if(!name)errors.push('예약자명');
  let timeObj=null;
  if(timeStr){timeObj=parseTimeStr(timeStr);if(!timeObj)errors.push('시간형식');else if(timeObj.h<11||timeObj.h>=22)errors.push('시간범위(11~21시)');}
  if(errors.length) return {error:errors.join('·')+' 필요'};
  const slot=timeObj.h<16?'am':'pm';
  const timeLabel=`${pad(timeObj.h)}:${pad(timeObj.m)}`;
  return {dateKey,timeLabel,timeH:timeObj.h,name,people:people||'',memo:memo.join(' '),slot};
}

function parseInput(){
  const raw=document.getElementById('kakao-input').value.trim();
  const preview=document.getElementById('preview'),btn=document.getElementById('btn-add');
  parsed=null;
  if(!raw){preview.innerHTML='<div class="empty">입력하면 미리보기</div>';btn.disabled=true;return;}
  const result=parseReservationText(raw);
  if(result.error){preview.innerHTML=`<div class="preview-error">⚠ ${result.error}</div>`;btn.disabled=true;return;}
  const d=new Date(result.dateKey+'T00:00:00');const days=['일','월','화','수','목','금','토'];
  preview.innerHTML=`

function deleteRow(dateKey,slot,id){

// ── 룸 → 테이블 매핑 ─────────────────────────────────
const ROOM_MAP = {
  '1룸':[31,32], '2룸':[33,34], '3룸':[35,36],
  '5룸':[41,42], '6룸':[43,44], '7룸':[45,46], '8룸':[47,48],
  '2층5룸':[51,52,53,54,55,56], '2층6룸':[61,62,63,64],
  '2층7룸':[71,72,73,74,75,76], '홀':[81,82,83,84],
  '창가1':[1,2], '창가2':[3,4], '창가3':[5,6], '창가4':[7,8],
};

// 테이블 값 → 룸명 변환 (배치도 표시용)
function resolveTableLabel(val){
  if(!val) return '';
  const v = val.trim();
  // 숫자면 그대로
  if(/^\d+$/.test(v)) return v;
  // 룸 이름이면 첫 번째 테이블 번호 반환 (배치도 매칭용)
  for(const [room, tables] of Object.entries(ROOM_MAP)){
    if(v===room) return String(tables[0]);
  }
  return v;
}

// 배치도에서 테이블 번호 매칭 (룸명 포함)
// 배치도에서 테이블 번호 매칭 (룸명, T접미사 포함)
function tableMatches(tableVal, tNum){
  const t=String(tableVal).trim();
  if(!t) return false;
  // 룸 이름이면 룸 매칭만 (숫자 추출 안 함)
  if(ROOM_MAP[t]){
    return ROOM_MAP[t].includes(tNum);
  }
  // 룸 이름이 아니면 숫자만 추출해서 비교 (41T, 41 t, 52.55T 등)
  const nums = t.match(/\d+/g);
  if(nums && nums.map(Number).includes(tNum)) return true;
  return false;
}

function getBookings(tNum){
  const data=reservations[currentDateKey]||{am:[],pm:[]};
  const tag=r=>Object.assign({},r,{dateKey:currentDateKey});
  return{
    am:data.am.filter(r=>tableMatches(r.table,tNum)).map(tag),
    pm:data.pm.filter(r=>tableMatches(r.table,tNum)).map(tag)
  };
}
function cellClass(tNum){
  const b=getBookings(tNum);
  if(b.am.length&&b.pm.length)return'booked-both';
  if(b.am.length)return'booked-am';
  if(b.pm.length)return'booked-pm';
  return'vacant';
}

// ── 테이블 셀 HTML ────────────────────────────────────
function tblHTML(num){
  const b=getBookings(num);
  const cls=cellClass(num);
  let chips='';
  b.am.forEach(r=>{chips+=`<div class="booking-chip chip-am">${r.time} ${escapeHtml(r.name)}</div>`;});
  b.pm.forEach(r=>{chips+=`<div class="booking-chip chip-pm">${r.time} ${escapeHtml(r.name)}</div>`;});
  // 이동 모드: 출발 테이블 강조, 다른 테이블은 선택 대상
  if(moveMode){
    const isFrom = String(moveMode.fromTable)===String(num);
    const moveStyle = isFrom ? 'outline:2px solid var(--am);outline-offset:-2px;opacity:.6' : 'outline:2px dashed var(--green);outline-offset:-2px';
    return`<div class="tbl-cell ${cls}" style="${moveStyle}" onclick="applyMove(${num})">
      <div class="tbl-num">${num}</div>${chips}
    </div>`;
  }
  return`<div class="tbl-cell ${cls}" onclick="showTableDetail(${num})">
    <div class="tbl-num">${num}</div>${chips}
  </div>`;
}

// ── 모바일 팝업 ───────────────────────────────────────
function showTableDetail(tNum){
  const b=getBookings(tNum);
  if(!b.am.length&&!b.pm.length)return;
  document.getElementById('popup-title').textContent=`${tNum}번 테이블`;
  let html='';
  function rowHtml(r,slot){
    const cls=slot==='am'?'popup-time-am':'popup-time-pm';
    return `<div class="popup-row">
      <span class="${cls}">${r.time}</span>
      <span class="popup-name">${escapeHtml(r.name)}</span>
      <span class="popup-people">${r.people?r.people+'명':''}</span>
      <button onclick='startMove("${r.dateKey||currentDateKey}","${slot}","${r.id}",${tNum})' style="margin-left:8px;background:var(--am);color:#000;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">이동</button>
    </div>${r.memo?`<div class="popup-memo" style="padding:2px 0 6px 58px;">${escapeHtml(r.memo)}</div>`:''}`;
  }
  b.am.forEach(r=>{html+=rowHtml(r,'am');});
  b.pm.forEach(r=>{html+=rowHtml(r,'pm');});

function closePopup(){
  document.getElementById('mobile-popup').classList.remove('show');
  document.getElementById('popup-overlay').style.display='none';
}

// ── 테이블 이동 ───────────────────────────────────────
let moveMode = null; // {dateKey, slot, id, fromTable}

function startMove(dateKey, slot, id, fromTable){
  moveMode = {dateKey, slot, id:String(id), fromTable};
  closePopup();
  showBanner(`이동할 테이블을 선택하세요 (${fromTable}번에서 이동)`);
  renderMap();
}

function cancelMove(){
  moveMode=null;
  renderMap();
}

async function applyMove(toTable){
  if(!moveMode) return;
  const {dateKey, slot, id, fromTable} = moveMode;
  const list = (reservations[dateKey]||{})[slot] || [];
  const r = list.find(x=>String(x.id)===id);
  if(!r){ moveMode=null; renderMap(); return; }
  if(String(fromTable)===String(toTable)){ moveMode=null; renderMap(); return; }

  r.table = String(toTable);
  moveMode=null;
  saveToSheet();
  renderMap();

  // 채팅방에 이동 알림 등록
  const d=new Date(dateKey+'T00:00:00');
  const moveMsg = {
    id: Date.now(),
    time: new Date().toISOString(),
    sender: '시스템',
    text: `📍 ${d.getMonth()+1}월 ${d.getDate()}일 · ${r.name} ${fromTable}번 → ${toTable}번 이동`
  };
  await saveChat(moveMsg);
  showBanner(`${fromTable}번 → ${toTable}번 이동 완료`);
}

async function doLogin(){

  if(!id||!pw){err.textContent='아이디와 비밀번호를 입력하세요';return;}
  err.textContent='확인 중...';
  try{

    const json=await res.json();
    const user=(json.users||[]).find(u=>String(u.id)===id && String(u.pw)===pw);

async function loadChats(){

    chatMessages=(json.chats||[]).map(c=>{
      const msg={id:Number(c.id),time:String(c.time),sender:String(c.sender),text:String(c.text)};

async function saveChat(msg){
  chatMessages.push(msg);
  try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
  try{
    await fetch(API_URL,{
      method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'saveChat',chat:msg})
    });
  }catch(e){}

// 채팅 스크롤 시 떠있는 날짜 표시 + 바닥 도달 시 읽음 처리
(function(){
  const box=document.getElementById('chat-messages');
  const floatDate=document.getElementById('chat-floating-date');
  if(!box||!floatDate) return;
  let hideTimer=null;
  box.addEventListener('scroll',()=>{
    // 현재 화면 상단에 보이는 메시지의 날짜 찾기
    const msgs=box.querySelectorAll('[data-date]');
    const boxTop=box.getBoundingClientRect().top;
    let curDate='';
    for(const el of msgs){
      const r=el.getBoundingClientRect();
      if(r.top-boxTop<=10) curDate=el.getAttribute('data-date');
      else break;
    }
    if(curDate){
      floatDate.textContent=curDate;
      floatDate.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer=setTimeout(()=>floatDate.classList.remove('show'),1200);
    }
    // 바닥 근처면 읽음 처리
    if(box.scrollHeight-box.scrollTop-box.clientHeight<60){
      markAsRead();
    }
  });
})();

function startReply(msgId){
  const m=chatMessages.find(x=>String(x.id)===String(msgId));
  if(!m) return;
  replyTarget=m;
  document.getElementById('reply-bar-sender').textContent=m.sender;
  document.getElementById('reply-bar-text').textContent=m.text.slice(0,50);
  document.getElementById('reply-bar').classList.add('show');
  document.getElementById('chat-input').focus();
}
function cancelReply(){
  replyTarget=null;
  document.getElementById('reply-bar').classList.remove('show');
}

// 원본 메시지에서 등록된 예약 찾기
function findReservationFromMessage(msg){
  const parsed=parseReservationText(msg.text);
  if(parsed.error) return null;
  const list=(reservations[parsed.dateKey]||{})[parsed.slot]||[];
  // 이름+시간 우선, 없으면 이름만
  let r=list.find(x=>x.name===parsed.name && x.time===parsed.timeLabel);
  if(!r) r=list.find(x=>x.name===parsed.name);
  return r ? {res:r, dateKey:parsed.dateKey, slot:parsed.slot} : null;
}

// 답장 텍스트에서 변경 내용 분석
function analyzeChange(text){
  const t=text.trim();
  const changes={};
  // 취소
  if(/취소|캔슬|노쇼|안와|안 와|안옴/.test(t)){ changes.cancel=true; return changes; }
  // 시간 변경
  const timeMatch=t.match(/(\d{1,2}\s*시\s*\d{0,2}\s*분?|\d{1,2}:\d{2}|\d{1,2}\s*시\s*반?)/);
  if(timeMatch && /변경|으로|로|바꿔|수정/.test(t)){
    const to=parseTimeStr(timeMatch[1].replace(/\s/g,''));
    if(to && to.h>=11 && to.h<22){ changes.time={h:to.h,m:to.m}; }
  }else if(timeMatch && /시|:/.test(timeMatch[1])){
    const to=parseTimeStr(timeMatch[1].replace(/\s/g,''));
    if(to && to.h>=11 && to.h<22){ changes.time={h:to.h,m:to.m}; }
  }
  // 인원 변경: "8명", "총 9명", "3명 추가"
  const addMatch=t.match(/(\d+)\s*명?\s*추가/);
  const totalMatch=t.match(/총\s*(\d+)\s*명/);
  const peopleMatch=t.match(/(\d+[.\/+]?\d*)\s*명/);
  if(totalMatch){ changes.people=totalMatch[1]; }
  else if(addMatch){ changes.peopleAdd=parseInt(addMatch[1]); }
  else if(peopleMatch && /변경|으로|로|명$/.test(t)){ changes.people=peopleMatch[1].replace(/[.+]/g,'/'); }
  // 테이블 변경
  const tableMatch=t.match(/(\d{1,2}\s*[Tt]|[1-8]룸|홀)/);
  if(tableMatch && /테이블|자리|[Tt]|룸|배치/.test(t)){ changes.table=tableMatch[1].replace(/\s/g,''); }
  return changes;
}

// 답장으로 예약 수정 처리 (확인 팝업)
function tryModifyByReply(replyMsg, replyText){
  const found=findReservationFromMessage(replyMsg);
  if(!found){
    return false; // 원본 예약 못 찾음 → 일반 답장으로
  }
  const {res, dateKey, slot}=found;
  const changes=analyzeChange(replyText);
  if(Object.keys(changes).length===0) return false; // 변경 내용 없음 → 일반 답장

  // 취소
  if(changes.cancel){
    if(confirm(`예약을 취소할까요?\n\n${res.name} ${res.time} ${res.people}명`)){
      reservations[dateKey][slot]=reservations[dateKey][slot].filter(x=>x.id!==res.id);
      saveToSheet();
      const d=new Date(dateKey+'T00:00:00');
      saveChat({id:Date.now(),time:new Date().toISOString(),sender:'시스템',
        text:`❌ ${d.getMonth()+1}월 ${d.getDate()}일 · ${res.name} 예약 취소됨`});
      render();renderChat();
      return true;
    }
    return true; // 취소 눌렀어도 처리한 걸로
  }

  // 변경 요약
  let summary=[], applied={};
  if(changes.time){
    const newLabel=`${pad(changes.time.h)}:${pad(changes.time.m)}`;
    summary.push(`시간 ${res.time} → ${newLabel}`);
    applied.time=newLabel; applied.timeH=changes.time.h; applied.newSlot=changes.time.h<16?'am':'pm';
  }
  if(changes.people){ summary.push(`인원 ${res.people}명 → ${changes.people}명`); applied.people=changes.people; }
  if(changes.peopleAdd){
    const cur=parseInt(String(res.people).split('/')[0])||0;
    const nv=cur+changes.peopleAdd;
    summary.push(`인원 ${res.people}명 → ${nv}명`); applied.people=String(nv);
  }
  if(changes.table){ summary.push(`테이블 ${res.table||'미배정'} → ${changes.table}`); applied.table=changes.table; }

  if(summary.length===0) return false;

  if(confirm(`예약을 수정할까요?\n\n${res.name}\n${summary.join('\n')}`)){
    if(applied.time){ res.time=applied.time; res.timeH=applied.timeH;
      // 시간대(오전/오후) 바뀌면 이동
      if(applied.newSlot!==slot){
        reservations[dateKey][slot]=reservations[dateKey][slot].filter(x=>x.id!==res.id);
        if(!reservations[dateKey][applied.newSlot])reservations[dateKey][applied.newSlot]=[];
        reservations[dateKey][applied.newSlot].push(res);
      }
    }
    if(applied.people!==undefined) res.people=applied.people;
    if(applied.table!==undefined) res.table=applied.table;
    saveToSheet();
    const d=new Date(dateKey+'T00:00:00');
    saveChat({id:Date.now(),time:new Date().toISOString(),sender:'시스템',
      text:`✏️ ${d.getMonth()+1}월 ${d.getDate()}일 · ${res.name} 수정: ${summary.join(', ')}`});
    render();renderChat();
  }
  return true;
}

// 스와이프로 답장
function attachSwipeReply(){
  const box=document.getElementById('chat-messages');
  if(!box) return;
  box.querySelectorAll('.chat-msg').forEach(el=>{
    let startX=0, startY=0, dragging=false;
    el.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY; dragging=true;
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!dragging) return;
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(Math.abs(dy)>Math.abs(dx)){dragging=false;el.style.transform='';return;}
      if(dx>0 && dx<80){ el.style.transform=`translateX(${dx}px)`; }
    },{passive:true});
    el.addEventListener('touchend',e=>{
      if(!dragging) return;
      dragging=false;
      const dx=el.style.transform.match(/translateX\((\d+)/);
      el.style.transform='';
      if(dx && parseInt(dx[1])>50){
        startReply(el.getAttribute('data-id'));
      }
    });
    // PC: 더블클릭으로 답장
    el.addEventListener('dblclick',()=>startReply(el.getAttribute('data-id')));

    // 본인 메시지 삭제: 길게누르기(모바일) / 우클릭(PC)
    if(el.classList.contains('mine')){
      let pressTimer=null;
      el.addEventListener('touchstart',()=>{
        pressTimer=setTimeout(()=>askDeleteChat(el.getAttribute('data-id')),600);
      },{passive:true});
      el.addEventListener('touchend',()=>clearTimeout(pressTimer));
      el.addEventListener('touchmove',()=>clearTimeout(pressTimer));
      el.addEventListener('contextmenu',e=>{
        e.preventDefault();
        askDeleteChat(el.getAttribute('data-id'));
      });
    }
  });
}

function askDeleteChat(msgId){
  const m=chatMessages.find(x=>String(x.id)===String(msgId));
  if(!m) return;
  if(m.sender!==currentSender){ showBanner('본인 메시지만 삭제할 수 있어요'); return; }
  if(confirm(`이 메시지를 삭제할까요?\n\n"${m.text.slice(0,40)}"`)){
    deleteChat(m.id);
  }
}

async function deleteChat(msgId){
  chatMessages=chatMessages.filter(x=>x.id!==msgId);
  try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
  renderChat();
  try{
    await fetch(API_URL,{
      method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'deleteChat',id:msgId})
    });
  }catch(e){}
}

async function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text) return;

  // 답장이면 예약 수정/취소 먼저 시도
  if(replyTarget){
    const handled=tryModifyByReply(replyTarget, text);
    if(handled){
      input.value=''; input.style.height='auto';
      cancelReply();
      scrollChatBottom();
      return;
    }
  }

  const now=new Date();
  const msg={id:Date.now(),time:now.toISOString(),sender:currentSender,text};
  if(replyTarget) msg.replyTo=replyTarget.id;
  input.value='';
  input.style.height='auto';
  cancelReply();

  await saveChat(msg);
  renderChat();
  scrollChatBottom();

  // 파싱 시도
  const result=parseReservationText(text);
  if(!result.error){
    const auto=document.getElementById('auto-register').checked;
    if(auto){
      doRegisterFromChat(msg.id,result);
    }
  }
}

function doRegisterFromChat(msgId,result){
  if(registeredMsgIds.has(msgId)) return;
  const key=result.dateKey;
  if(!reservations[key])reservations[key]={am:[],pm:[]};
  reservations[key][result.slot].push({id:Date.now()+Math.random(),time:result.timeLabel,timeH:result.timeH,name:result.name,people:result.people,memo:result.memo,table:''});
  reservations[key][result.slot].sort((a,b)=>a.time.localeCompare(b.time));
  registeredMsgIds.add(msgId);
  saveToSheet();
  renderChat();
}

function renderChat(){
  const box=document.getElementById('chat-messages');
  if(!box) return;
  if(!chatMessages.length){
    box.innerHTML='<div style="text-align:center;color:#444;font-size:13px;padding:40px 0">아직 메시지가 없어요.<br>예약을 입력해보세요.</div>';
    return;
  }
  const days=['일','월','화','수','목','금','토'];
  let html='', lastDate='';
  // 안 읽은 첫 메시지 위치 찾기 (내가 보낸 게 아니고, lastReadId 이후)
  let firstUnreadIdx=-1;
  if(lastReadId){
    for(let i=0;i<chatMessages.length;i++){
      if(chatMessages[i].id===lastReadId){
        // 그 다음 메시지가 안 읽은 첫 메시지
        for(let j=i+1;j<chatMessages.length;j++){
          if(chatMessages[j].sender!==currentSender){ firstUnreadIdx=j; break; }
        }
        break;
      }
    }
  }

  chatMessages.forEach((m,idx)=>{
    // 검색 필터: 검색어 있으면 매칭 메시지만
    if(searchTerm && !m.text.toLowerCase().includes(searchTerm)) return;

    const d=new Date(m.time);
    const dateStr=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
    if(dateStr!==lastDate){
      html+=`<div class="chat-date-divider" data-date="${dateStr}"><span>${dateStr}</span></div>`;
      lastDate=dateStr;
    }
    if(idx===firstUnreadIdx && !searchTerm){
      html+=`<div class="chat-read-divider">여기까지 읽었습니다</div>`;
    }
    const timeStr=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const mine=(m.sender===currentSender);
    const result=parseReservationText(m.text);
    let parsedHtml='';
    if(!result.error){
      const rd=new Date(result.dateKey+'T00:00:00');
      const registered = registeredMsgIds.has(m.id) || isAlreadyReserved(result);
      parsedHtml=`<div class="chat-msg-parsed">
        <div class="chat-parsed-info">📋 <b>${rd.getMonth()+1}/${rd.getDate()}</b> ${result.timeLabel} · <b>${result.name}</b> ${result.people?result.people+'명':''} ${result.memo?'· '+result.memo:''}</div>
        ${registered
          ? `<button class="chat-register-btn done">✓ 등록됨</button>`
          : `<button class="chat-register-btn" onclick='doRegisterFromChatById(${m.id})'>예약 등록</button>`}
      </div>`;
    }
    // 검색어 하이라이트
    let textHtml=escapeHtml(m.text);
    if(searchTerm){
      const re=new RegExp('('+searchTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      textHtml=textHtml.replace(re,'<mark style="background:var(--am);color:#000">$1</mark>');
    }
    // 답장 인용 (이 메시지가 다른 메시지에 답장한 경우)
    let quoteHtml='';
    if(m.replyTo){
      const orig=chatMessages.find(x=>x.id===m.replyTo);
      if(orig){
        quoteHtml=`<div class="chat-quote"><div class="chat-quote-sender">${escapeHtml(orig.sender)}</div><div class="chat-quote-text">${escapeHtml(orig.text.slice(0,40))}</div></div>`;
      }
    }
    html+=`<div class="chat-msg ${mine?'mine':''}" data-date="${dateStr}" data-id="${m.id}">
      ${!mine?`<div class="chat-msg-sender">${escapeHtml(m.sender)}</div>`:''}
      ${quoteHtml}
      <div class="chat-msg-text">${textHtml}</div>
      <div class="chat-msg-time">${timeStr}</div>
      ${parsedHtml}
    </div>`;
  });
  if(searchTerm && !html){
    html='<div style="text-align:center;color:#444;font-size:13px;padding:40px 0">검색 결과가 없어요</div>';
  }
  box.innerHTML=html;
  attachSwipeReply();
}

// 읽음 처리: 마지막 메시지를 읽음으로 표시
function markAsRead(){
  if(chatMessages.length){
    lastReadId=chatMessages[chatMessages.length-1].id;
    try{localStorage.setItem('sangmuok_lastread',String(lastReadId));}catch{}
  }
}

function doRegisterFromChatById(msgId){
  const m=chatMessages.find(x=>x.id===msgId);
  if(!m) return;
  const result=parseReservationText(m.text);
  if(result.error) return;
  // 이미 등록된 예약이면 중복 방지
  if(isAlreadyReserved(result)){
    registeredMsgIds.add(msgId);
    renderChat();
    return;
  }
  doRegisterFromChat(msgId,result);
}

// 같은 예약이 이미 등록돼 있는지 확인 (날짜+시간+이름+인원 일치)
function isAlreadyReserved(result){
  const list=(reservations[result.dateKey]||{})[result.slot]||[];
  return list.some(r=>
    r.time===result.timeLabel &&
    r.name===result.name &&
    String(r.people)===String(result.people)
  );
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 엔터 처리: 모바일은 줄바꿈, PC는 Enter 전송 (Shift+Enter 줄바꿈)
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
(function(){
  const ci=document.getElementById('chat-input');
  if(ci){
    ci.addEventListener('keydown',e=>{
      // PC에서만 Enter 전송, 모바일은 기본 줄바꿈 동작 유지
      if(!IS_MOBILE && e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        sendChat();
      }
    });
    ci.addEventListener('input',()=>{
      ci.style.height='auto';
      ci.style.height=Math.min(ci.scrollHeight,120)+'px';
    });
  }
})();

  updateDateLabel();render();closeCalendar();

function renderCalendar(){
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-title').textContent=`${calYear}년 ${months[calMonth]}`;
  const days=['일','월','화','수','목','금','토'];
  const today=todayKey();
  let html=days.map((d,i)=>`<div class="cal-dow${i===0?' sun':i===6?' sat':''}">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const last=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<first;i++) html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=last;d++){
    const key=`${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const dow=(first+d-1)%7;
    const hasRes=reservations[key]&&((reservations[key].am||[]).length+(reservations[key].pm||[]).length)>0;
    const isSel=key===currentDateKey;
    const isToday=key===today;
    const dowCls=dow===0?' sun-col':dow===6?' sat-col':'';
    html+=`<div class="cal-day${isSel?' selected':isToday?' today':''}${hasRes?' has-reservation':''}${dowCls}" onclick="selectCalDay('${key}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}
// 캘린더 팝업 초기 숨김
document.getElementById('cal-popup').style.display='none';

// ── 자동 새로고침 (실시간 동기화) ──────────────────────
let autoSyncPaused=false;

function isUserTyping(){
  const a=document.activeElement;
  if(!a) return false;
  return a.tagName==='TEXTAREA' || a.tagName==='INPUT';
}

async function autoSync(){
  // 입력 중이거나 저장 중이면 건너뜀
  if(isUserTyping() || isSyncing || autoSyncPaused) return;
  // 캘린더 열려있으면 건너뜀
  if(document.getElementById('cal-popup').style.display!=='none') return;

  try{
    const res=await fetch(API_URL+'?t='+Date.now());
    const json=await res.json();
    const newRes={};
    (json.data||[]).forEach(raw=>{
      const row={};
      Object.keys(raw).forEach(k=>row[k.toLowerCase()]=raw[k]);
      const dateKey=String(row.datekey||'').trim();
      const slot=String(row.slot||'').trim();
      if(!dateKey||!slot) return;
      let timeH=Number(row.timeh);
      let timeStr=String(row.time||'');
      let mm=0;
      if(/^\d{1,2}:\d{2}/.test(timeStr)){const p=timeStr.split(':');timeH=Number(p[0]);mm=Number(p[1]);}
      else if(timeStr.includes('T')){const d=new Date(timeStr);if(!isNaN(d))mm=d.getUTCMinutes();}
      if(isNaN(timeH))timeH=12;
      if(!newRes[dateKey])newRes[dateKey]={am:[],pm:[]};
      newRes[dateKey][slot].push({id:Number(row.id),time:`${pad(timeH)}:${pad(mm)}`,timeH,name:String(row.name||''),people:String(row.people||''),memo:String(row.memo||''),table:String(row.table||'')});
    });
    Object.values(newRes).forEach(s=>{
      s.am.sort((a,b)=>a.time.localeCompare(b.time));
      s.pm.sort((a,b)=>a.time.localeCompare(b.time));
    });
    // 변경 있을 때만 갱신 (화면 깜빡임 최소화)
    const changed=JSON.stringify(newRes)!==JSON.stringify(reservations);
    if(changed){
      reservations=newRes;
      try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
      if(currentTab!=='chat') render();
      typeof renderCalendar==='function' && renderCalendar();
    }
  }catch(e){}

  // 채팅도 갱신
  if(currentTab==='chat'){
    try{
      const res=await fetch(API_URL+'?type=chats&t='+Date.now());
      const json=await res.json();
      const newChats=(json.chats||[]).map(c=>{
        const msg={id:Number(c.id),time:String(c.time),sender:String(c.sender),text:String(c.text)};
        if(c.replyTo && String(c.replyTo).trim()) msg.replyTo=Number(c.replyTo);
        return msg;
      });
      if(JSON.stringify(newChats)!==JSON.stringify(chatMessages)){
        const box=document.getElementById('chat-messages');
        const atBottom=box && (box.scrollHeight-box.scrollTop-box.clientHeight<60);
        chatMessages=newChats;
        try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
        renderChat();
        if(atBottom) scrollChatBottom();
      }
    }catch(e){}
  }
}

// 15초마다 자동 동기화
setInterval(autoSync, 15000);

// ── PWA 서비스워커 등록 ───────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}

// ── 알림 기능 ─────────────────────────────────────────
let notifyEnabled = false;
let prevResCount = countAllReservations();
let prevChatCount = 0;

function countAllReservations(){
  let n=0;
  Object.values(reservations).forEach(s=>{n+=(s.am||[]).length+(s.pm||[]).length;});
  return n;
}

// 알림음 (웹오디오로 생성 - 외부 파일 불필요)
function playNotifySound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const notes=[[880,0],[1175,0.12]]; // 두 음 "딩-동"
    notes.forEach(([freq,delay])=>{
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=freq;
      o.type='sine';
      const t=ctx.currentTime+delay;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.01,t+0.25);
      o.start(t);o.stop(t+0.3);
    });
  }catch(e){}
}

// 화면 알림 (브라우저 알림 권한 있으면 팝업, 없으면 화면 배너)
function showNotification(title, body){
  playNotifySound();
  if(notifyEnabled && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title,{body, icon:'./icon-192.png', tag:'sangmuok'}); }catch(e){}
  }
  showBanner(title+' '+body);
}

function showBanner(text){
  let b=document.getElementById('notify-banner');
  if(!b){
    b=document.createElement('div');
    b.id='notify-banner';
    b.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:90%;text-align:center;transition:opacity .3s,top .3s;cursor:pointer;';
    b.onclick=()=>{b.style.opacity='0';};
    document.body.appendChild(b);
  }
  b.textContent='🔔 '+text;
  b.style.opacity='1';
  b.style.top='12px';
  clearTimeout(b._timer);
  b._timer=setTimeout(()=>{b.style.opacity='0';},4000);
}

// 알림 권한 요청 (사용자 첫 클릭 시)
function requestNotifyPermission(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().then(p=>{ notifyEnabled=(p==='granted'); });
  }else if('Notification' in window && Notification.permission==='granted'){
    notifyEnabled=true;
  }
}
document.addEventListener('click', function once(){
  requestNotifyPermission();
  document.removeEventListener('click', once);
}, {once:true});

// autoSync 후 새 항목 감지해서 알림
const _origAutoSync = autoSync;
autoSync = async function(){
  await _origAutoSync();
  // 예약 증가 감지
  const nowRes=countAllReservations();
  if(nowRes>prevResCount && prevResCount>=0){
    showNotification('새 예약', `예약이 ${nowRes-prevResCount}건 추가됐어요`);
  }
  prevResCount=nowRes;
  // 채팅 증가 감지
  if(chatMessages.length>prevChatCount && prevChatCount>0){
    const last=chatMessages[chatMessages.length-1];
    if(last.sender!==currentSender){
      showNotification(last.sender, last.text.slice(0,30));
    }
  }
  prevChatCount=chatMessages.length;
};

// 초기 채팅 카운트 세팅
setTimeout(()=>{prevChatCount=chatMessages.length;prevResCount=countAllReservations();},3000);
</script>
