<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>상무옥 예약관리</title>
<link rel="manifest" href="./manifest.json?v=6">
<meta name="theme-color" content="#f7f5f1">
<meta name="description" content="상무옥 직원용 예약 및 메시지 관리 앱">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="상무옥">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#f7f5f1;--surface:#ffffff;--surface2:#efebe5;--border:#dcd6ce;
  --am:#785445;--am-dim:#f1e9e4;--pm:#53636a;--pm-dim:#e8edef;
  --text:#24211e;--text-dim:#716b64;--accent:#a5473d;--green:#405b4d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;letter-spacing:-.01em;}

/* 헤더 */
header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:rgba(247,245,241,.96);z-index:100;box-shadow:0 2px 12px rgba(61,47,38,.04);backdrop-filter:blur(10px);}
.logo{width:72px;height:40px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.logo img{height:82px;display:block;mix-blend-mode:multiply;}
.date-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.date-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.date-nav button:active{background:var(--surface2);}
#current-date-label{font-size:13px;font-weight:600;min-width:100px;text-align:center;}

/* 탭 */
.tabs{display:flex;padding:10px 16px 0;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;border-bottom:none;color:var(--text-dim);background:transparent;white-space:nowrap;touch-action:manipulation;}
.tab.am.active{background:var(--am-dim);border-color:var(--am);color:var(--am);}
.tab.pm.active{background:var(--pm-dim);border-color:var(--pm);color:var(--pm);}
.tab.map.active{background:#ece9e4;border-color:#5e5750;color:#403b36;}
.tab.chat.active{background:#e6ece8;border-color:var(--green);color:var(--green);}
.tab-badge{display:inline-block;background:var(--surface2);border-radius:10px;padding:1px 6px;font-size:11px;margin-left:5px;font-family:'DM Mono',monospace;}
.tab.am.active .tab-badge{background:var(--am);color:#fff;}
.tab.pm.active .tab-badge{background:var(--pm);color:#fff;}

/* ── 채팅 패널 ── */
.chat-panel{flex:1;display:none;flex-direction:column;height:100%;position:relative;}
.chat-panel.active{display:flex;}
.chat-map-drawer{position:absolute;top:0;right:0;bottom:0;width:50%;background:var(--bg);border-left:1px solid var(--border);box-shadow:-12px 0 30px rgba(55,45,38,.12);z-index:35;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;}
.chat-map-drawer.show{transform:translateX(0);}
.chat-map-handle{position:absolute;left:-42px;top:50%;transform:translateY(-50%);width:42px;height:76px;border:1px solid var(--border);border-right:none;border-radius:14px 0 0 14px;background:var(--surface);color:var(--green);box-shadow:-7px 3px 16px rgba(55,45,38,.13);font-size:28px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:36;touch-action:manipulation;}
.chat-map-handle::before{content:'‹';}
.chat-map-drawer.show .chat-map-handle::before{content:'›';}
.chat-map-handle:active{background:var(--surface2);}
.chat-map-head{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);background:#fff;}
.chat-map-title{font-size:14px;font-weight:700;}
.chat-map-date{min-width:125px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);padding:6px 7px;font-size:11px;}
.chat-map-close{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:20px;cursor:pointer;}
.chat-map-content{flex:1;overflow:auto;padding:16px;}
.chat-map-open{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:11px;font-weight:700;padding:5px 9px;cursor:pointer;}
@media(max-width:700px){
  .chat-map-drawer{width:66.666%;}
  .chat-map-content{padding:12px;}
}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;min-height:0;}
.chat-date-divider{text-align:center;font-size:11px;color:var(--text-dim);margin:8px 0;}
.chat-date-divider span{background:var(--surface2);padding:3px 12px;border-radius:10px;}
/* 스크롤 시 상단 떠있는 날짜 */
.chat-floating-date{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(55,50,45,.9);color:#fff;font-size:11px;padding:4px 14px;border-radius:12px;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s;backdrop-filter:blur(4px);}
.chat-floating-date.show{opacity:1;}
/* 읽음 구분선 */
.chat-read-divider{display:flex;align-items:center;gap:8px;margin:6px 0;color:#e85d4a;font-size:11px;}
.chat-read-divider::before,.chat-read-divider::after{content:'';flex:1;height:1px;background:rgba(232,93,74,.4);}
.chat-msg{max-width:75%;align-self:flex-start;background:var(--surface2);border-radius:4px 14px 14px 14px;padding:10px 13px;position:relative;transition:transform .15s;touch-action:pan-y;}
.chat-msg.mine{align-self:flex-end;background:#dfe8e2;border:1px solid #cad8cf;border-radius:14px 4px 14px 14px;}
/* 답장 인용 (메시지 안) */
.chat-quote{border-left:3px solid var(--am);padding:4px 8px;margin-bottom:6px;background:rgba(120,84,69,.07);border-radius:4px;font-size:12px;}
.chat-quote-sender{color:var(--am);font-weight:700;font-size:10px;}
.chat-quote-text{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 답장 화살표 (스와이프 시 나타남) */
.chat-reply-hint{position:absolute;left:-30px;top:50%;transform:translateY(-50%);color:var(--am);font-size:18px;opacity:0;transition:opacity .15s;}
/* 입력창 위 답장 미리보기 바 */
.reply-bar{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--surface2);border-top:1px solid var(--border);font-size:12px;}
.reply-bar.show{display:flex;}
.reply-bar-info{flex:1;min-width:0;}
.reply-bar-sender{color:var(--am);font-weight:700;font-size:11px;}
.reply-bar-text{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar-close{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:0 4px;}
.chat-msg-sender{font-size:11px;color:var(--am);font-weight:700;margin-bottom:3px;}
.chat-msg.mine .chat-msg-sender{color:var(--green);}
.chat-msg-text{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.chat-msg-time{font-size:9px;color:var(--text-dim);margin-top:4px;text-align:right;}
.message-action-overlay{display:none;position:fixed;inset:0;background:rgba(36,33,30,.28);z-index:2200;}
.message-action-overlay.show{display:block;}
.message-action-sheet{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(360px,calc(100% - 28px));background:#fff;border:1px solid var(--border);border-radius:16px;padding:8px;box-shadow:0 18px 50px rgba(36,33,30,.2);}
.message-action-preview{padding:11px 12px;color:var(--text-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--border);margin-bottom:4px;}
.message-action-btn{width:100%;border:none;background:#fff;color:var(--text);padding:13px 12px;border-radius:10px;text-align:left;font-size:15px;font-weight:700;cursor:pointer;}
.message-action-btn:active{background:var(--surface2);}
.message-action-btn.delete{color:var(--accent);}
.message-edit-dialog{display:none;position:fixed;inset:0;background:rgba(36,33,30,.32);z-index:2210;align-items:center;justify-content:center;padding:20px;}
.message-edit-dialog.show{display:flex;}
.message-edit-card{width:min(460px,100%);background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 18px 50px rgba(36,33,30,.22);}
.message-edit-title{font-size:16px;font-weight:800;margin-bottom:12px;}
.message-edit-text{width:100%;min-height:120px;resize:vertical;border:1px solid var(--border);border-radius:10px;padding:12px;font:14px/1.6 'Noto Sans KR',sans-serif;color:var(--text);outline:none;}
.message-edit-text:focus{border-color:var(--green);}
.message-edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
.message-edit-actions button{border:1px solid var(--border);border-radius:8px;padding:9px 16px;background:#fff;font-size:13px;font-weight:700;cursor:pointer;}
.message-edit-actions .save{background:var(--green);border-color:var(--green);color:#fff;}
.chat-msg-parsed{margin-top:8px;padding-top:8px;border-top:1px solid rgba(36,33,30,.1);font-size:11px;}
.chat-parsed-info{color:var(--text-dim);line-height:1.6;}
.chat-parsed-info b{color:var(--text);}
.chat-register-btn{margin-top:6px;background:var(--green);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;width:100%;font-family:'Noto Sans KR',sans-serif;}
.chat-register-btn.done{background:var(--surface);color:var(--text-dim);cursor:default;}
.chat-input-bar{
  padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
  display:flex;
  gap:10px;
  align-items:flex-end;
  background:var(--bg);
  flex-shrink:0;
  position:relative;
  z-index:10;
}
/* 라인은 입력창 영역 위에만 */
.chat-input-bar::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:var(--border);
  pointer-events:none;
}
.chat-input-bar textarea{
  flex:1 1 auto;
  min-width:0;
  height:auto;
  min-height:48px;
  max-height:120px;
  font-family:'Noto Sans KR',sans-serif;
  font-size:15px;
  line-height:1.4;
  padding:12px 14px;
  position:relative;
  z-index:1;
}
/* 전송 버튼: 원 전체가 클릭/터치 영역이 되도록 SVG 배경 방식 제거 */
.chat-send-btn{
  -webkit-appearance:none;
  appearance:none;
  border:none;
  outline:none;
  padding:0;
  margin:0;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  z-index:5;
  width:56px;
  height:56px;
  min-width:56px;
  min-height:56px;
  flex:0 0 56px;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:inherit;
  user-select:none;
  -webkit-user-select:none;
  overflow:hidden;
  pointer-events:auto;
}
.chat-send-btn:active{filter:brightness(0.9);transform:scale(0.97);}
.chat-send-btn::before{
  content:'';
  position:absolute;
  inset:-10px; /* 갤럭시에서 가장자리/가운데 터치 누락 방지용 여유 터치존 */
  border-radius:50%;
  background:transparent;
  pointer-events:none;
}
.chat-send-btn::after{
  content:'↑';
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  line-height:1;
  transform:translateY(-2px);
  color:#fff;
  pointer-events:none;
}
.chat-send-btn *{
  pointer-events:none;
}
.chat-send-icon{
  display:none; /* SVG 선 모양은 특정 구간 클릭 누락 원인이 될 수 있어 CSS 문자 아이콘으로 대체 */
}
@media (pointer:coarse){
  .chat-send-btn{
    width:60px;
    height:60px;
    min-width:60px;
    min-height:60px;
    flex-basis:60px;
  }
  .chat-send-icon{width:32px;height:32px;}
}
.chat-sender-select{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.chat-sender-select span{font-size:11px;color:var(--text-dim);}
.profile-name-btn{background:none;border:none;color:var(--green);font-size:12px;font-weight:700;cursor:pointer;padding:3px 2px;font-family:'Noto Sans KR',sans-serif;}
.chat-sender-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.chat-sender-btn.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:700;}
.chat-auto-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);cursor:pointer;}
.notify-control{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim);}
.notify-control select{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:11px;padding:0 5px;}
.notify-test{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:11px;padding:0 7px;cursor:pointer;}

/* 예약 입력 플로팅 버튼 */
.fab-add{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 8px 24px rgba(51,67,57,.24);z-index:90;display:none;align-items:center;justify-content:center;line-height:1;}
.fab-add.show{display:flex;}
/* 입력 바텀시트 오버레이 */
.input-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;}
.input-overlay.show{display:block;}
.input-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;z-index:301;padding:18px 18px 28px;transform:translateY(100%);transition:transform .25s;max-height:85vh;overflow-y:auto;}
.input-sheet.show{transform:translateY(0);}
.input-sheet-handle{width:40px;height:4px;background:#c7c0b8;border-radius:2px;margin:0 auto 16px;}


/* 메인 레이아웃 - dvh로 키보드 대응 */
.main{display:flex;height:calc(100dvh - 105px);}

/* ── 입력 패널 (오전/오후 탭에서만 표시) ── */
.input-panel{width:260px;min-width:260px;border-right:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.input-panel.hidden{display:none;}
.panel-title{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;line-height:1.7;padding:12px;resize:none;height:140px;width:100%;outline:none;}
textarea:focus{border-color:#8c8178;box-shadow:0 0 0 3px rgba(120,84,69,.08);}
textarea::placeholder{color:#a39b93;}
.preview-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px;font-size:12px;min-height:72px;}
.preview-box .pv-row{display:flex;justify-content:space-between;padding:2px 0;}
.preview-box .pv-label{color:var(--text-dim);}
.preview-box .pv-val{font-weight:500;font-family:'DM Mono',monospace;}
.pv-time-am{color:var(--am);}.pv-time-pm{color:var(--pm);}
.preview-box .empty{color:#9a928a;font-size:12px;text-align:center;padding:12px 0;}
.preview-error{color:var(--accent);font-size:12px;padding:4px 0;}
.btn-add{background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;}
.btn-add:disabled{background:var(--surface2);color:var(--text-dim);cursor:not-allowed;}
.hint{font-size:11px;color:#817a73;line-height:1.8;border-top:1px solid var(--border);padding-top:10px;}
.hint strong{color:#5f5953;display:block;margin-bottom:3px;}

/* ── 예약 리스트 ── */
.table-panel{flex:1;overflow-y:auto;padding:18px 20px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.section-dot{width:8px;height:8px;border-radius:50%;}
.section-dot.am{background:var(--am);}.section-dot.pm{background:var(--pm);}
.section-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.section-title.am{color:var(--am);}.section-title.pm{color:var(--pm);}
.section-count{font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace;}
table{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:24px;}
thead th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid #e7e2dc;}
tbody tr:hover{background:#fbfaf8;}
tbody td{padding:15px 10px;vertical-align:middle;line-height:1.65;}
.td-time{font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:800;white-space:nowrap;}
.td-time.am{color:var(--am);}.td-time.pm{color:var(--pm);}
.td-name{font-size:17px;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;}
.td-people{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:800;color:var(--text);}
.td-memo{font-size:14px;font-weight:600;color:var(--text-dim);}
.btn-del{background:none;border:none;color:#aaa29a;cursor:pointer;font-size:14px;padding:4px 6px;border-radius:4px;}
.btn-del:hover{color:var(--accent);}
.empty-state{text-align:center;padding:48px 0;color:#918981;font-size:13px;}
.empty-state .emoji{font-size:32px;display:block;margin-bottom:12px;opacity:.4;}
.summary-bar{display:flex;gap:16px;margin-bottom:12px;padding:8px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border);font-size:12px;}
.summary-bar span{color:var(--text-dim);}
.summary-bar strong{color:var(--text);font-family:'DM Mono',monospace;}
.reservation-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
.reservation-select-all{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;}
.reservation-checkbox{width:18px;height:18px;accent-color:var(--green);cursor:pointer;}
.reservation-delete-selected{border:1px solid #d7b8b3;border-radius:7px;background:#fff;color:var(--accent);padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer;}
.reservation-delete-selected:disabled{opacity:.4;cursor:not-allowed;}
.reservation-row-selected{background:#f3eee9;}
.td-table-input{background:#fff;border:1px solid #d8d1c9;border-radius:7px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;width:100%;min-width:92px;padding:7px 8px;outline:none;}
.td-table-input:focus{border-bottom-color:#81776e;color:var(--text);}
.td-edit-input{width:100%;min-width:78px;background:#fff;border:1px solid #d8d1c9;border-radius:7px;color:var(--text);padding:7px 8px;font:700 14px/1.3 'Noto Sans KR',sans-serif;outline:none;}
.td-edit-input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(64,91,77,.1);}
.td-edit-date{min-width:132px;font-size:12px;}
.td-edit-time{min-width:94px;font-size:14px;}
.td-edit-name{min-width:105px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;}
.td-edit-people{min-width:72px;}
.td-edit-memo{min-width:130px;font-weight:600;}

/* ── 배치도 패널 ── */
.map-panel{flex:1;overflow-y:auto;padding:20px 24px;display:none;}
.map-panel.active{display:block;}

/* 범례 */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding:10px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.map-period-control{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:0;z-index:15;background:var(--bg);padding:2px 0 8px;}
.map-period-btn{flex:1;max-width:150px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-dim);padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.map-period-btn.active{background:var(--green);border-color:var(--green);color:#fff;}

/* 층 섹션 */
.floor-section{margin-bottom:24px;}
.floor-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#514a44;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.floor-label::after{content:'';flex:1;height:1px;background:#d9d3cc;}

/* 구역 레이아웃 */
.floor-zones{display:flex;flex-direction:column;gap:12px;}

/* 구역 행 */
.zone-row{display:flex;gap:12px;align-items:flex-start;}
.zone-group{display:flex;flex-direction:column;gap:4px;}
.zone-name{font-size:9px;font-weight:700;letter-spacing:1px;color:#847d76;text-transform:uppercase;text-align:center;margin-bottom:4px;}

/* 룸 안 테이블 쌍 */
.room-box{background:#f2efea;border:1px solid #ddd7cf;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;}
.room-box.window-room{background:#edf2ee;border-color:#d5dfd7;}
.room-box.room-h{flex-direction:row;}

/* 구분선 (룸 사이 간격) */
.zone-gap{width:20px;flex-shrink:0;}
.zone-divider{width:1px;background:#ddd7cf;align-self:stretch;margin:0 4px;}

/* 테이블 셀 */
.tbl-cell{
  border-radius:6px;padding:6px 5px;
  width:62px;height:62px;
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  cursor:pointer;transition:all .15s;border:1px solid transparent;overflow:hidden;
  position:relative;
}
@media(max-width:600px){.tbl-cell{width:50px;height:50px;padding:4px 3px;}}
.tbl-cell:active{filter:brightness(1.2);}
.tbl-cell.vacant{background:var(--surface2);border-color:var(--border);}
.tbl-cell.booked-am{background:rgba(120,84,69,.12);border-color:var(--am);}
.tbl-cell.booked-pm{background:rgba(83,99,106,.12);border-color:var(--pm);}
.tbl-cell.booked-both{background:linear-gradient(135deg,rgba(120,84,69,.13) 50%,rgba(83,99,106,.13) 50%);border-color:#6b625b;}
.tbl-num{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--text-dim);line-height:1;margin-bottom:2px;}
.tbl-cell.booked-am .tbl-num{color:var(--am);}
.tbl-cell.booked-pm .tbl-num{color:var(--pm);}
.tbl-cell.booked-both .tbl-num{color:#564f49;}
.booking-chip{font-size:10px;font-weight:800;line-height:1.45;text-align:center;width:100%;padding:2px 3px;border-radius:2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip-am{background:rgba(120,84,69,.13);color:var(--am);}
.chip-pm{background:rgba(83,99,106,.13);color:var(--pm);}

/* 모바일 탭 상세 (탭 클릭 시 나오는 팝업) */
.mobile-popup{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid var(--border);border-radius:16px 16px 0 0;
  padding:20px;z-index:500;max-height:60vh;overflow-y:auto;
}
.mobile-popup.show{display:block;}
.popup-handle{width:36px;height:4px;background:#c7c0b8;border-radius:2px;margin:0 auto 16px;}
.popup-title{font-size:14px;font-weight:700;color:#4e4842;margin-bottom:12px;font-family:'DM Mono',monospace;}
.popup-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #ebe7e2;font-size:13px;align-items:center;}
.popup-time-am{color:var(--am);font-size:15px;font-weight:800;font-family:'Noto Sans KR',sans-serif;min-width:58px;}
.popup-time-pm{color:var(--pm);font-size:15px;font-weight:800;font-family:'Noto Sans KR',sans-serif;min-width:58px;}
.popup-name{font-size:16px;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;}
.popup-people{font-size:14px;font-weight:800;}
.popup-name{font-weight:500;}
.popup-people{color:var(--text-dim);font-size:12px;margin-left:auto;}
.popup-memo{color:#7f7770;font-size:11px;}
.popup-close{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:10px;margin-top:14px;font-size:13px;cursor:pointer;touch-action:manipulation;}
/* 캘린더 팝업 */
.cal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);}
.cal-overlay.show{display:block;}
.cal-popup{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:#fff;border:1px solid var(--border);border-radius:14px;
  padding:18px;z-index:201;width:310px;
  box-shadow:0 18px 48px rgba(55,45,38,.18);
}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-size:14px;font-weight:700;color:var(--text);}
.cal-nav{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{font-size:10px;font-weight:700;text-align:center;color:var(--text-dim);padding:4px 0;}
.cal-dow.sun{color:#e85d4a;}.cal-dow.sat{color:var(--pm);}
.cal-day{
  font-size:12px;font-family:'DM Mono',monospace;
  text-align:center;padding:6px 2px;border-radius:6px;cursor:pointer;
  color:var(--text-dim);transition:all .1s;
}
.cal-day:hover{background:var(--surface2);color:var(--text);}
.cal-day.today{color:var(--am);font-weight:700;}
.cal-day.selected{background:var(--am);color:#fff;font-weight:700;}
.cal-day.has-reservation{position:relative;}
.cal-day.has-reservation::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--green);}
.cal-day.empty{cursor:default;pointer-events:none;}
.cal-day.sun-col{color:#c84a4a;}
.cal-day.sat-col{color:#4a7ac8;}
.cal-today-btn{width:100%;margin-top:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.cal-today-btn:hover{color:var(--text);}
.print-settings{display:none;position:fixed;inset:0;z-index:2200;background:rgba(36,33,30,.42);align-items:center;justify-content:center;padding:20px;}
.print-settings.show{display:flex;}
.print-settings-card{width:100%;max-width:360px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 18px 48px rgba(55,45,38,.18);}
.print-settings-title{font-size:18px;font-weight:700;margin-bottom:18px;}
.print-settings-label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin:14px 0 7px;}
.print-date{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 12px;background:var(--surface);color:var(--text);font-size:14px;}
.print-periods{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.print-periods label{display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--border);border-radius:9px;padding:10px 6px;font-size:13px;cursor:pointer;}
.print-settings-actions{display:flex;gap:8px;margin-top:20px;}
.print-settings-actions button{border-radius:9px;padding:11px;border:1px solid var(--border);font-weight:700;cursor:pointer;}
.print-cancel{flex:1;background:var(--surface2);color:var(--text);}
.print-run{flex:2;background:var(--green);border-color:var(--green)!important;color:#fff;}
</style>

</head>
<body>

<header>
  <div class="logo"><img src="./logo.jpg" alt="상무옥"></div>
  <div class="date-nav">
    <button onclick="changeDate(-1)">‹</button>
    <span id="current-date-label" onclick="openCalendar()" style="cursor:pointer;border-bottom:1px dashed #aaa29a;padding-bottom:1px"></span>
    <button onclick="changeDate(1)">›</button>
  </div>
  <button onclick="openPrintSettings()" style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0 12px;height:30px;cursor:pointer;font-size:12px;margin-left:8px">프린트</button>
</header>

<!-- 캘린더 오버레이 -->
<div class="cal-overlay" id="cal-overlay" onclick="closeCalendar()"></div>
<div class="cal-popup" id="cal-popup">
  <div class="cal-header">
    <button class="cal-nav" onclick="calChangeMonth(-1)">‹</button>
    <div class="cal-title" id="cal-title"></div>
    <button class="cal-nav" onclick="calChangeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <button class="cal-today-btn" onclick="goToday()">오늘로 이동</button>
</div>

<div class="tabs">
  <div class="tab am active" onclick="switchTab('am')">오전 <span class="tab-badge" id="badge-am">0</span></div>
  <div class="tab pm" onclick="switchTab('pm')">오후 <span class="tab-badge" id="badge-pm">0</span></div>
  <div class="tab map" onclick="switchTab('map')">배치도</div>
  <div class="tab chat" onclick="switchTab('chat')">예약톡</div>
</div>

<div class="main">
  <!-- 예약 입력 바텀시트 -->
  <div class="input-overlay" id="input-overlay" onclick="closeInputSheet()"></div>
  <div class="input-sheet" id="input-panel">
    <div class="input-sheet-handle"></div>
    <div class="panel-title">예약 입력</div>
    <textarea id="kakao-input" placeholder="카톡 예약 붙여넣기&#10;&#10;금요일&#10;12시&#10;5.2명&#10;이종&#10;룸" oninput="parseInput()"></textarea>
    <div class="preview-box" id="preview"><div class="empty">입력하면 미리보기</div></div>
    <button class="btn-add" id="btn-add" onclick="addReservation()" disabled>예약 추가</button>
    <div class="hint">
      <strong>입력 형식</strong>
      요일 또는 날짜 (생략 시 오늘)<br>
      시간: 12시, 12:30, 오후1시<br>
      인원: 5명, 5.2명, 5/2명<br>
      예약자명 / 메모
    </div>
  </div>

  <!-- 예약 리스트 -->
  <div class="table-panel" id="table-panel"></div>

  <!-- 배치도 -->
  <div class="map-panel" id="map-panel"></div>

  <!-- 예약톡 -->
  <div class="chat-panel" id="chat-panel">
    <div class="chat-sender-select">
      <input id="chat-search" placeholder="채팅 검색" oninput="searchChat()" style="flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 10px;font-size:13px;outline:none;font-family:'Noto Sans KR',sans-serif">
      <span id="search-count" style="font-size:11px;color:var(--text-dim)"></span>
      <span style="font-size:11px;color:var(--text-dim)">|</span>
      <button class="chat-map-open" type="button" onclick="openChatMap()">배치도</button>
      <button id="my-profile" class="profile-name-btn" type="button" onclick="openProfileName(false)" title="사용자 이름 수정"></button>
      <button onclick="logout()" style="background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;text-decoration:underline">로그아웃</button>
      <label class="chat-auto-toggle"><input type="checkbox" id="auto-register" checked> 자동등록</label>
      <label class="notify-control"><input type="checkbox" id="notify-enabled" onchange="changeNotificationSetting(this.checked)"> 알림</label>
      <label class="notify-control">
        <select id="notify-sound" onchange="changeNotificationSound(this.value)" aria-label="알림음">
          <option value="dingdong">딩동</option>
          <option value="soft">부드럽게</option>
          <option value="bell">벨</option>
          <option value="none">무음</option>
        </select>
      </label>
      <button class="notify-test" type="button" onclick="testNotificationSound()">소리 확인</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-floating-date" id="chat-floating-date"></div>
    <div class="reply-bar" id="reply-bar">
      <div class="reply-bar-info">
        <div class="reply-bar-sender" id="reply-bar-sender"></div>
        <div class="reply-bar-text" id="reply-bar-text"></div>
      </div>
      <button class="reply-bar-close" onclick="cancelReply()">✕</button>
    </div>
    <div class="chat-input-bar">
      <textarea id="chat-input" placeholder="예약 입력 (예: 금 6시 4명 홍길동 1룸)" rows="1"></textarea>
      <button id="chat-send-btn" class="chat-send-btn" type="button" aria-label="전송">
        <svg class="chat-send-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5 12l7-7 7 7"></path>
        </svg>
      </button>
    </div>
    <aside id="chat-map-drawer" class="chat-map-drawer" aria-label="예약톡 배치도">
      <button id="chat-map-handle" class="chat-map-handle" type="button" onclick="toggleChatMap()" aria-label="배치도 펼치기"></button>
      <div class="chat-map-head">
        <div class="chat-map-title">실시간 배치도</div>
        <input id="chat-map-date" class="chat-map-date" type="date" onchange="changeChatMapDate(this.value)" aria-label="배치도 날짜">
        <button class="chat-map-close" type="button" onclick="closeChatMap()" aria-label="배치도 닫기">×</button>
      </div>
      <div id="chat-map-content" class="chat-map-content"></div>
    </aside>
  </div>
</div>

<!-- 로그인 화면 -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:2000;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
  <div style="font-size:24px;font-weight:700;margin-bottom:4px">상무<span style="color:var(--am)">옥</span></div>
  <div style="font-size:13px;color:var(--text-dim);margin-bottom:28px">예약관리 로그인</div>
  <input id="login-id" placeholder="이메일 또는 아이디" autocomplete="username" style="width:100%;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:13px 14px;font-size:15px;margin-bottom:10px;outline:none">
  <input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password" style="width:100%;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:13px 14px;font-size:15px;margin-bottom:16px;outline:none">
  <button onclick="doLogin()" style="width:100%;max-width:280px;background:var(--green);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">로그인</button>
  <div id="login-error" style="color:var(--accent);font-size:13px;margin-top:12px;min-height:18px"></div>
</div>

<!-- 예약톡 사용자 이름 설정 -->
<div id="profile-name-screen" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:2100;align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;">
    <div style="font-size:18px;font-weight:700;margin-bottom:6px">예약톡 이름 설정</div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px">채팅에 표시할 사용자 이름을 입력하세요.</div>
    <input id="profile-name-input" maxlength="20" autocomplete="name" placeholder="예: 김상무" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 13px;font-size:15px;outline:none;font-family:'Noto Sans KR',sans-serif">
    <div id="profile-name-error" style="color:var(--accent);font-size:12px;margin:8px 0;min-height:18px"></div>
    <div style="display:flex;gap:8px">
      <button id="profile-name-cancel" type="button" onclick="closeProfileName()" style="flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px;cursor:pointer">취소</button>
      <button id="profile-name-save" type="button" onclick="saveProfileName()" style="flex:2;background:var(--green);color:#fff;border:none;border-radius:9px;padding:11px;font-weight:700;cursor:pointer">저장</button>
    </div>
  </div>
</div>

<!-- 예약지 출력 설정 -->
<div id="print-settings" class="print-settings" onclick="if(event.target===this)closePrintSettings()">
  <div class="print-settings-card">
    <div class="print-settings-title">예약지 프린트</div>
    <label class="print-settings-label" for="print-date">출력 날짜</label>
    <input id="print-date" class="print-date" type="date">
    <span class="print-settings-label">출력할 예약지</span>
    <div class="print-periods">
      <label><input type="checkbox" name="print-page" value="am-1" checked> 오전 1층</label>
      <label><input type="checkbox" name="print-page" value="am-2" checked> 오전 2층</label>
      <label><input type="checkbox" name="print-page" value="pm-1" checked> 오후 1층</label>
      <label><input type="checkbox" name="print-page" value="pm-2" checked> 오후 2층</label>
    </div>
    <div class="print-settings-actions">
      <button class="print-cancel" type="button" onclick="closePrintSettings()">취소</button>
      <button class="print-run" type="button" onclick="printReservations()">예약지 열기</button>
    </div>
  </div>
</div>

<!-- 모바일 팝업 -->
<div class="mobile-popup" id="mobile-popup" onclick="event.stopPropagation()">
  <div class="popup-handle"></div>
  <div class="popup-title" id="popup-title"></div>
  <div id="popup-body"></div>
  <button class="popup-close" onclick="closePopup()">닫기</button>
</div>
<div id="popup-overlay" style="display:none;position:fixed;inset:0;z-index:499;" onclick="closePopup()"></div>

<div id="message-action-overlay" class="message-action-overlay" onclick="closeMessageActions()">
  <div class="message-action-sheet" onclick="event.stopPropagation()">
    <div id="message-action-preview" class="message-action-preview"></div>
    <button class="message-action-btn" type="button" onclick="openMessageEdit()">메시지 수정</button>
    <button class="message-action-btn delete" type="button" onclick="deleteSelectedMessage()">메시지 삭제</button>
    <button class="message-action-btn" type="button" onclick="closeMessageActions()">취소</button>
  </div>
</div>

<div id="message-edit-dialog" class="message-edit-dialog" onclick="closeMessageEdit()">
  <div class="message-edit-card" onclick="event.stopPropagation()">
    <div class="message-edit-title">메시지 수정</div>
    <textarea id="message-edit-text" class="message-edit-text"></textarea>
    <div class="message-edit-actions">
      <button type="button" onclick="closeMessageEdit()">취소</button>
      <button class="save" type="button" onclick="saveMessageEdit()">수정 완료</button>
    </div>
  </div>
</div>

<!-- 예약 입력 플로팅 버튼 (오전/오후 탭에서만) -->
<button class="fab-add" id="fab-add" onclick="openInputSheet()">+</button>

<script src="./vendor/supabase-2.108.1.min.js"></script>
<script src="./supabase-config.js?v=24"></script>
<script src="./supabase-store.js?v=24"></script>
<script>
// ── 상태 ─────────────────────────────────────────────
let currentTab='am', currentDateKey=todayKey(), reservations={}, parsed=null;
let isSyncing=false;
let syncRequested=false;
let notificationSettings=(()=>{
  try{
    return {...{enabled:false,sound:'dingdong'},...JSON.parse(localStorage.getItem('sangmuok_notification_settings')||'{}')};
  }catch{return {enabled:false,sound:'dingdong'};}
})();

function todayKey(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function pad(n){return String(n).padStart(2,'0');}

// ── Supabase 연동 ─────────────────────────────────────
function showSyncStatus(msg, color='#716b64'){
  let el=document.getElementById('sync-status');
  if(!el){
    el=document.createElement('div');
    el.id='sync-status';
    el.style.cssText='position:fixed;bottom:16px;right:16px;background:#fff;border:1px solid #dcd6ce;border-radius:8px;padding:8px 14px;font-size:12px;z-index:999;transition:opacity .3s;box-shadow:0 8px 24px rgba(55,45,38,.1);';
    document.body.appendChild(el);
  }
  el.style.color=color;
  el.textContent=msg;
  el.style.opacity='1';

async function saveToSheet(){

    return;

  showSyncStatus('저장 중...');
  // 로컬 캐시에도 저장
  try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
  try{
    await SangmuokDB.syncReservations(reservations);
    showSyncStatus('✓ 저장 완료','#405b4d');
  }catch(e){
    console.error(e);
    showSyncStatus('저장 실패 · 로컬 보관','#a5473d');

  isSyncing=false;

// ── 파싱 ─────────────────────────────────────────────
const DAY_MAP={'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':0};
function normalizeReservationTypos(raw){
  return String(raw)
    // 날짜 단어 오타와 붙여쓰기: 오늫6시, 내알 오후6시 등
    .replace(/(오늘|오늫|오눌|오느|오널|오놀|오날|오늣|오늩|오늘르|오늘을)(?=\s|$|\d|오전|오후)/g,'오늘 ')
    .replace(/(내일|내알|내얼|내읾|낼)(?=\s|$|\d|오전|오후)/g,'내일 ')
    .replace(/(모레|모래|모례|모랴)(?=\s|$|\d|오전|오후)/g,'모레 ')
    // 요일과 예약 단위의 흔한 키보드 오타
    .replace(/([월화수목금토일])용일/g,'$1요일')
    .replace(/(\d{1,2})\s*씨/g,'$1시')
    .replace(/(\d+)\s*멍/g,'$1명')
    .replace(/(\d{1,2})\s*[푼뷴]/g,'$1분')
    .replace(/[ \t]+/g,' ')
    .trim();
}

function parseTimeStr(str){
  let pm=false,am=false;
  if(str.includes('오후')){pm=true;str=str.replace('오후','').trim();}
  if(str.includes('오전')){am=true;str=str.replace('오전','').trim();}
  // 조사 제거: "6시로", "6시에", "6시까지"
  str=str.replace(/시(로|에|까지|쯤|경)$/,'시').trim();

  // N분뒤/후
  const minLater=str.match(/^(\d+)\s*분\s*(뒤|후)$/);
  if(minLater){
    const now=new Date();
    now.setMinutes(now.getMinutes()+parseInt(minLater[1]));
    return{h:now.getHours(),m:now.getMinutes()};
  }

  // N시간뒤/후
  const hrLater=str.match(/^(\d+)\s*시간\s*(뒤|후)$/);
  if(hrLater){
    const now=new Date();
    now.setHours(now.getHours()+parseInt(hrLater[1]));
    return{h:now.getHours(),m:now.getMinutes()};
  }

  let h,m=0;

  // 6시30분, 6시 30분
  const hm2=str.match(/^(\d{1,2})\s*시\s*(\d{1,2})\s*분$/);
  // 12시30 (분 글자 없이 숫자만) - 카톡에서 가장 흔한 형태
  const hm3=str.match(/^(\d{1,2})\s*시\s*(\d{1,2})$/);
  if(hm2){h=parseInt(hm2[1]);m=parseInt(hm2[2]);}
  else if(hm3){h=parseInt(hm3[1]);m=parseInt(hm3[2]);}
  // 6시반
  else if(/^(\d{1,2})\s*시\s*반$/.test(str)){h=parseInt(str.match(/^(\d{1,2})/)[1]);m=30;}
  // 6시
  else if(/^(\d{1,2})\s*시$/.test(str)){h=parseInt(str.match(/^(\d{1,2})/)[1]);}
  // 12:30
  else{
    const hm=str.match(/^(\d{1,2}):(\d{2})/);
    if(hm){h=parseInt(hm[1]);m=parseInt(hm[2]);}
    else{const ho=str.match(/^(\d{1,2})/);if(!ho)return null;h=parseInt(ho[1]);}
  }

  if(pm&&h<12)h+=12;
  // 매장 예약에서는 "오전 12시"도 정오 12시 예약으로 처리
  if(am&&h===12)h=12;
  // 오전 명시 없고 1~9시면 오후로 처리
  if(!am&&!pm&&h>=1&&h<=9)h+=12;
  return{h,m};
}
// 텍스트 → 예약 객체 파싱 (성공시 객체, 실패시 {error})
function parseReservationText(raw){
  if(!raw||!raw.trim()) return {error:'빈 입력'};
  let normalized = normalizeReservationTypos(raw);
  // 붙어있는 토큰 분리
  normalized = normalized
    .replace(/(\d{1,2})월\s+(\d{1,2})일/g, '$1/$2')
    .replace(/(오전|오후)\s+(\d{1,2}\s*(?:시|:\d{2}))/g, '$1$2')
    .replace(/(\d{1,2}\s*시\s*\d{1,2}\s*분)(\d{1,2}\/?\d*명)/g, '$1 $2')
    .replace(/(\d{1,2}\s*시\s*반)(\d{1,2}\/?\d*명)/g, '$1 $2')
    .replace(/(\d{1,2}\s*시\s*\d{1,2})(명)/g, '$1$2')
    .replace(/(\d{1,2}\s*시)(\d{1,2}\/?\d*명)/g, '$1 $2')
    .replace(/(\d{1,2}:\d{2})(\d{1,2}\/?\d*명)/g, '$1 $2')
    // 인원 표기 뒤에만 공백 추가. 이름의 "명"(김명자)은 건드리지 않는다.
    .replace(/(\d+(?:[.\/+]\d+)?\s*명)(?=\S)/g, '$1 ');
  const lines=normalized.split(/\n/).map(l=>l.trim()).filter(Boolean);
  // 모든 줄을 공백 기준으로 토큰화 (한 줄에 여러 정보 있어도 분리)
  let workLines = [];
  lines.forEach(l=>{
    l.split(/\s+/).filter(Boolean).forEach(tok=>workLines.push(tok));
  });
  let dateKey=currentDateKey,timeStr=null,name=null,people=null,memo=[],dateExplicit=false,statedDow=null;
  const remainLines=[];
  const TODAY = todayKey(); // 실제 오늘 (보고 있는 날짜 아님)
  for(let li=0; li<workLines.length; li++){
    const line=workLines[li];
    if(/^오늘$/.test(line)){dateKey=TODAY;dateExplicit=true;continue;}
    if(/^(내일|낼)$/.test(line)){
      const d=new Date(TODAY+'T00:00:00');d.setDate(d.getDate()+1);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;dateExplicit=true;continue;
    }
    if(/^모레$/.test(line)){
      const d=new Date(TODAY+'T00:00:00');d.setDate(d.getDate()+2);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;dateExplicit=true;continue;
    }
    const nextWeekMatch=line.match(/^(다음\s*주|담주)\s*([월화수목금토일])요?일?$/);
    if(nextWeekMatch){
      const dow=DAY_MAP[nextWeekMatch[2]];
      const d=new Date(TODAY+'T00:00:00');
      let diff=dow-d.getDay();if(diff<=0)diff+=7;diff+=7;
      d.setDate(d.getDate()+diff);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    if(/^[월화수목금토일]요?일?$/.test(line)){
      const dow=DAY_MAP[line[0]];
      statedDow=dow;
      // "18일 목요일"처럼 날짜가 앞에 있으면 아래에서 실제 요일 일치 여부를 검증
      if(dateExplicit) continue;
      const d=new Date(TODAY+'T00:00:00');
      let diff=dow-d.getDay();if(diff<0)diff+=7;
      d.setDate(d.getDate()+diff);
      dateKey=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;continue;
    }
    const dm=line.match(/^(\d{1,2})[\/월](\d{1,2})일?$/);
    if(dm){dateKey=`${new Date().getFullYear()}-${dm[1].padStart(2,'0')}-${dm[2].padStart(2,'0')}`;dateExplicit=true;continue;}
    // N일 단독 (예: "12일") - 이번 달 또는 다음 달 해당 일자
    const dayOnly=line.match(/^(\d{1,2})일$/);
    if(dayOnly){
      const day=parseInt(dayOnly[1]);
      const t=new Date(TODAY+'T00:00:00');
      let y=t.getFullYear(), mo=t.getMonth();
      // 오늘보다 이전 일자면 다음 달로
      if(day<t.getDate()) mo++;
      if(mo>11){mo=0;y++;}
      dateKey=`${y}-${pad(mo+1)}-${pad(day)}`;dateExplicit=true;continue;
    }
    // 시간 토큰 (12시, 12시30, 12시30분, 12:30, 6시반)
    if(!timeStr && /^(오전|오후)?\d{1,2}\s*(시|:)/.test(line) || (!timeStr && /\d/.test(line) && (line.includes('분뒤')||line.includes('분후')||line.includes('시간뒤')||line.includes('시간후')))){
      timeStr=line;
      // 다음 토큰이 "30분" 또는 "30"(분단독)이면 시간에 흡수 (11시 30분 / 11시 30)
      if(li+1<workLines.length && /^\d{1,2}분?$/.test(workLines[li+1]) && line.includes('시') && !/\d시\d/.test(line) && !line.includes('분')){
        timeStr=line.replace(/분?$/,'')+workLines[li+1];
        li++;
      }
      continue;
    }
    // 인원 토큰: 5명, 5/1명, 5.1명, 5+1명 (점/슬래시/플러스 = 어른/유아 구분)
    if(!people && /^\d+[.\/+]?\d*\s*명$/.test(line)){
      people=line.replace('명','').replace(/[.+]/g,'/').trim();
      continue;
    }
    // 인원이 "명" 없이 앞에 시간/날짜 다 있고 숫자만 단독일 때 (드뭄) - 건너뜀
    remainLines.push(line);
  }
  if(dateExplicit && statedDow!==null){
    const selectedDate=new Date(dateKey+'T00:00:00');
    if(selectedDate.getDay()!==statedDow){
      const dayNames=['일','월','화','수','목','금','토'];
      return {error:`날짜·요일 불일치 (${selectedDate.getMonth()+1}/${selectedDate.getDate()}은 ${dayNames[selectedDate.getDay()]}요일)`};
    }
  }
  // remainLines에서 메모성 단어와 이름 분리
  // 메모 키워드: 룸, 갈비, 홀, 한테이블, 유아의자, 대기, 취소, 변경, 도착 등
  const MEMO_KW=/룸|갈비|홀|한테이블|테이블|유아|아기|의자|대기|취소|변경|도착|예정|입금|어른|소인|일반\d|매운\d|번방|예약/;
  if(remainLines.length>=1){
    // 첫 줄이 메모 키워드면 이름이 따로 없을 수 있음 → 이름은 키워드 아닌 첫 줄
    let nameIdx=remainLines.findIndex(l=>!MEMO_KW.test(l) && (!/^\d/.test(l)||/^\d+회$/.test(l)));
    if(nameIdx<0) nameIdx=0;
    const nameIndexes=[nameIdx];
    // "김명 자", "금북 21회"처럼 이름이 띄어 입력된 경우 이름으로 합친다.
    for(let i=nameIdx+1;i<remainLines.length;i++){
      const part=remainLines[i];
      if(MEMO_KW.test(part)) break;
      if(/^[가-힣]$/.test(part)||/^\d+회$/.test(part)) nameIndexes.push(i);
      else break;
    }
    name=nameIndexes.map(i=>remainLines[i]).join('');
    memo=remainLines.filter((_,i)=>!nameIndexes.includes(i));
  }
  const errors=[];
  if(!timeStr)errors.push('시간');
  if(!name)errors.push('예약자명');
  let timeObj=null;
  if(timeStr){timeObj=parseTimeStr(timeStr);if(!timeObj)errors.push('시간형식');else if(timeObj.h<11||timeObj.h>=22)errors.push('시간범위(11~21시)');}
  if(errors.length) return {error:errors.join('·')+' 필요'};
  const slot=timeObj.h<16?'am':'pm';
  const timeLabel=`${pad(timeObj.h)}:${pad(timeObj.m)}`;
  const meridiem=timeObj.h>=12?'오후':'오전';
  const memoText=memo.join(' ');
  const table=extractTableAssignment(memoText);
  return {dateKey,timeLabel,timeH:timeObj.h,meridiem,name,people:people||'',memo:memoText,table,slot};
}

function parseInput(){
  const raw=document.getElementById('kakao-input').value.trim();
  const preview=document.getElementById('preview'),btn=document.getElementById('btn-add');
  parsed=null;
  if(!raw){preview.innerHTML='<div class="empty">입력하면 미리보기</div>';btn.disabled=true;return;}
  const result=parseReservationText(raw);
  if(result.error){preview.innerHTML=`<div class="preview-error">⚠ ${result.error}</div>`;btn.disabled=true;return;}
  const d=new Date(result.dateKey+'T00:00:00');const days=['일','월','화','수','목','금','토'];
  preview.innerHTML=`
    <div class="pv-row"><span class="pv-label">날짜</span><span class="pv-val">${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})</span></div>
    <div class="pv-row"><span class="pv-label">시간</span><span class="pv-val pv-time-${result.slot}">${escapeHtml(result.timeLabel)} · ${result.meridiem}</span></div>
    <div class="pv-row"><span class="pv-label">예약자</span><span class="pv-val">${escapeHtml(result.name)}</span></div>
    <div class="pv-row"><span class="pv-label">인원</span><span class="pv-val">${escapeHtml(result.people||'-')}명</span></div>
    ${result.table?`<div class="pv-row"><span class="pv-label">테이블</span><span class="pv-val">${escapeHtml(result.table)}</span></div>`:''}
    ${result.memo?`<div class="pv-row"><span class="pv-label">메모</span><span class="pv-val">${escapeHtml(result.memo)}</span></div>`:''}`;
  parsed=result;
  btn.disabled=false;
}

// ── 예약 추가/삭제 ────────────────────────────────────
function addReservation(){
  if(!parsed)return;
  const key=parsed.dateKey;
  if(!reservations[key])reservations[key]={am:[],pm:[]};
  reservations[key][parsed.slot].push({id:Date.now(),time:parsed.timeLabel,timeH:parsed.timeH,name:parsed.name,people:parsed.people,memo:parsed.memo,table:parsed.table||''});
  reservations[key][parsed.slot].sort((a,b)=>a.time.localeCompare(b.time));
  showCapacityRisk(key,parsed.slot);
  saveToSheet();
  currentDateKey=parsed.dateKey;
  if(currentTab!=='map'){
    currentTab=parsed.slot;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelector(`.tab.${parsed.slot}`).classList.add('active');
  }
  updateDateLabel();
  document.getElementById('kakao-input').value='';
  document.getElementById('preview').innerHTML='<div class="empty">입력하면 미리보기</div>';
  document.getElementById('btn-add').disabled=true;
  parsed=null;render();
  closeInputSheet();
}
function deleteRow(dateKey,slot,id){
  if(!reservations[dateKey]?.[slot])return;
  const reservation=reservations[dateKey][slot].find(r=>String(r.id)===String(id));
  if(!reservation)return;
  if(!confirm(`${reservation.name} 예약을 삭제할까요?`))return;
  reservations[dateKey][slot]=reservations[dateKey][slot].filter(r=>String(r.id)!==String(id));
  try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
  const d=new Date(dateKey+'T00:00:00');
  addSystemChat(
    `❌ ${d.getMonth()+1}월 ${d.getDate()}일 · ${reservation.name} ${displayTime(reservation.time)} ${displayPeople(reservation.people)} 예약 취소됨 (예약지 삭제)`
  );
  render();
  // 삭제 저장 중에는 실시간 재조회로 항목이 잠시 복원되지 않도록 차단
  autoSyncPaused=true;
  saveToSheet();
  setTimeout(()=>{autoSyncPaused=false;},10000);
}

function updateReservationSelection(){
  const checks=[...document.querySelectorAll('.reservation-row-check')];
  const selected=checks.filter(input=>input.checked);
  checks.forEach(input=>input.closest('tr')?.classList.toggle('reservation-row-selected',input.checked));
  const all=document.getElementById('reservation-select-all');
  if(all){
    all.checked=checks.length>0&&selected.length===checks.length;
    all.indeterminate=selected.length>0&&selected.length<checks.length;
  }
  const button=document.getElementById('reservation-delete-selected');
  if(button){
    button.disabled=selected.length===0;
    button.textContent=selected.length?`선택삭제 (${selected.length})`:'선택삭제';
  }
}

function deleteSelectedReservations(dateKey,slot){
  const ids=[...document.querySelectorAll('.reservation-row-check:checked')].map(input=>String(input.value));
  if(!ids.length) return;
  const list=reservations[dateKey]?.[slot]||[];
  const selected=list.filter(reservation=>ids.includes(String(reservation.id)));
  if(!selected.length) return;
  if(!confirm(`선택한 예약 ${selected.length}건을 삭제할까요?`)) return;

  reservations[dateKey][slot]=list.filter(reservation=>!ids.includes(String(reservation.id)));
  try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
  const d=new Date(dateKey+'T00:00:00');
  const details=selected
    .map(reservation=>`${reservation.name} ${displayTime(reservation.time)} ${displayPeople(reservation.people)}`)
    .join('\n');
  addSystemChat(`❌ ${d.getMonth()+1}월 ${d.getDate()}일 · 예약 ${selected.length}건 취소됨 (예약지 선택삭제)\n${details}`);
  autoSyncPaused=true;
  saveToSheet();
  setTimeout(()=>{autoSyncPaused=false;},10000);
  render();
  renderMap();
  showBanner(`예약 ${selected.length}건을 삭제했습니다`);
}

function updateTable(dateKey,slot,id,val){
  const r=reservations[dateKey]?.[slot]?.find(r=>String(r.id)===String(id));
  if(r){r.table=val;saveToSheet();showCapacityRisk(dateKey,slot);renderMap();}
}

function updateReservationField(dateKey,slot,id,field,value){
  const source=reservations[dateKey]?.[slot];
  const reservation=source?.find(item=>String(item.id)===String(id));
  if(!reservation) return;

  let targetDate=dateKey;
  let targetSlot=slot;
  if(field==='date'){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
    targetDate=value;
  }else if(field==='time'){
    const parsedTime=parseTimeStr(value);
    if(!parsedTime||parsedTime.h<11||parsedTime.h>=22){
      showBanner('시간은 오전 11시부터 오후 9시까지 입력하세요');
      render();
      return;
    }
    reservation.time=`${pad(parsedTime.h)}:${pad(parsedTime.m)}`;
    reservation.timeH=parsedTime.h;
    targetSlot=parsedTime.h<16?'am':'pm';
  }else if(field==='name'){
    if(!value.trim()){showBanner('예약자명을 입력하세요');render();return;}
    reservation.name=value.trim();
  }else if(field==='people'){
    reservation.people=String(value||'').replace(/명/g,'').replace(/[.+]/g,'/').replace(/\s+/g,'');
  }else if(field==='memo'){
    reservation.memo=value.trim();
  }

  if(targetDate!==dateKey||targetSlot!==slot){
    reservations[dateKey][slot]=source.filter(item=>String(item.id)!==String(id));
    if(!reservations[targetDate]) reservations[targetDate]={am:[],pm:[]};
    reservations[targetDate][targetSlot].push(reservation);
  }
  reservations[targetDate][targetSlot].sort((a,b)=>a.time.localeCompare(b.time));
  try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
  autoSyncPaused=true;
  saveToSheet();
  setTimeout(()=>{autoSyncPaused=false;},10000);
  render();
  renderMap();
  showBanner(`${reservation.name} 예약을 수정했습니다`);
}

// ── 룸 → 테이블 매핑 ─────────────────────────────────
const ROOM_MAP = {
  '1룸':[31,32], '2룸':[33,34], '3룸':[35,36],
  '5룸':[41,42], '6룸':[43,44], '7룸':[45,46], '8룸':[47,48],
  '2층5룸':[51,52,53,54,55,56], '2층6룸':[61,62,63,64],
  '2층7룸':[71,72,73,74,75,76], '홀':[81,82,83,84],
  '창가1':[1,2], '창가2':[3,4], '창가3':[5,6], '창가4':[7,8],
};
const ALL_TABLES=[
  1,2,3,4,5,6,7,8,
  21,22,23,24,25,26,27,28,
  31,32,33,34,35,36,
  41,42,43,44,45,46,47,48,
  51,52,53,54,55,56,
  61,62,63,64,
  71,72,73,74,75,76,
  81,82,83,84
];
let mapPeriod='am';

function setMapPeriod(period){
  mapPeriod=period==='pm'?'pm':'am';
  renderMap();
}

function reservationRound(reservation){
  const match=`${reservation?.table||''} ${reservation?.memo||''}`.match(/([1-9])\s*차/);
  return match?Number(match[1]):0;
}

function bookingColor(time,round=0){
  const match=String(time||'').match(/^(\d{1,2}):(\d{2})/);
  const minutes=match?(Number(match[1])*60+Number(match[2])):0;
  const hue=(minutes*7+35+(round?round*47:0))%360;
  return {
    bg:`hsl(${hue} 42% 86%)`,
    border:`hsl(${hue} 35% 62%)`,
    text:`hsl(${hue} 40% 28%)`
  };
}

function displayTime(time){
  const match=String(time||'').match(/^(\d{1,2}):(\d{2})/);
  if(!match) return String(time||'');
  let hour=Number(match[1]);
  const minute=Number(match[2]);
  if(hour>12) hour-=12;
  if(hour===0) hour=12;
  return minute?`${hour}시 ${minute}분`:`${hour}시`;
}

function displayPeople(people){
  const value=String(people||'')
    .replace(/명/g,'')
    .replace(/[.+]/g,'/')
    .replace(/\s+/g,'')
    .trim();
  return value?`${value}명`:'-';
}

// 테이블 값 → 룸명 변환 (배치도 표시용)
function resolveTableLabel(val){
  if(!val) return '';
  const tables=assignedTableNumbers(val);
  return tables.length?tables.join(','):String(val).trim();
}

// 룸 여러 개, 개별 테이블, 연속 범위를 실제 테이블 번호 목록으로 변환
function assignedTableNumbers(tableVal){
  let text=String(tableVal||'')
    .replace(/[－–—∼]/g,'~')
    .replace(/\s+/g,' ')
    .trim();
  if(!text) return [];

  const assigned=new Set();
  const addRoom=roomName=>{
    (ROOM_MAP[roomName]||[]).forEach(number=>assigned.add(number));
  };

  function expandRoomNumbers(value){
    const range=value.match(/^([1-8])\s*[-~]\s*([1-8])$/);
    if(!range) return value.split(/\s*[,·/+&]\s*/);
    const start=Number(range[1]),end=Number(range[2]),step=start<=end?1:-1;
    const rooms=[];
    for(let room=start;;room+=step){
      rooms.push(String(room));
      if(room===end) break;
    }
    return rooms;
  }

  // "2층 5-6룸", "2층 5,6룸", "2층 5룸 2층 6룸"을 먼저 처리한다.
  text=text.replace(/2\s*층\s*([5-7](?:\s*[-~,·/+&]\s*[5-7])*)\s*룸/g,(_,rooms)=>{
    expandRoomNumbers(rooms).forEach(room=>addRoom(`2층${room}룸`));
    return ' ';
  });

  // "1-2룸", "5,6룸", "5룸 6룸"처럼 여러 룸을 한 예약에 배정할 수 있다.
  text=text.replace(/([1-8](?:\s*[-~,·/+&]\s*[1-8])*)\s*룸/g,(_,rooms)=>{
    expandRoomNumbers(rooms).forEach(room=>addRoom(`${room}룸`));
    return ' ';
  });

  text=text.replace(/홀/g,()=>{
    addRoom('홀');
    return ' ';
  });

  // "81-83", "81~83", "81번부터 83번까지"는 사이 번호까지 모두 포함한다.
  text=text.replace(/(\d{1,2})\s*(?:번)?\s*(?:-|~|부터)\s*(\d{1,2})\s*(?:번)?\s*(?:까지)?/g,(_,startRaw,endRaw)=>{
    const start=Number(startRaw),end=Number(endRaw);
    const step=start<=end?1:-1;
    for(let number=start;;number+=step){
      if(ALL_TABLES.includes(number)) assigned.add(number);
      if(number===end) break;
    }
    return ' ';
  });

  // 회차 숫자는 테이블 번호가 아니다.
  text=text.replace(/\d+\s*차/g,' ');
  (text.match(/\d{1,2}/g)||[])
    .map(Number)
    .filter(number=>ALL_TABLES.includes(number))
    .forEach(number=>assigned.add(number));

  return [...assigned];
}

function extractTableAssignment(memoText){
  const text=String(memoText||'').trim();
  if(!text) return '';
  const matches=[];
  const occupied=[];
  const patterns=[
    /2\s*층\s*[5-7](?:\s*[-~,·/+&]\s*[5-7])*\s*룸(?:\s*\d+\s*차)?/g,
    /[1-8](?:\s*[-~,·/+&]\s*[1-8])*\s*룸(?:\s*\d+\s*차)?/g,
    /홀(?:\s*\d+\s*차)?/g,
    /\d{1,2}\s*(?:번)?\s*(?:-|~|부터)\s*\d{1,2}\s*(?:번)?\s*(?:까지)?/g,
    /(?:^|\s)(\d{1,2})\s*(?:번|[Tt])?(?=\s|$)/g
  ];
  patterns.forEach((pattern,index)=>{
    for(const match of text.matchAll(pattern)){
      const start=match.index;
      const end=start+match[0].length;
      if(occupied.some(span=>start<span.end&&end>span.start)) continue;
      const value=(index===4?match[1]:match[0]).trim();
      if(assignedTableNumbers(value).length){
        matches.push(value);
        occupied.push({start,end});
      }
    }
  });
  return [...new Set(matches)].join(' ');
}

// 배치도에서 테이블 번호 매칭 (룸명, 범위, T접미사 포함)
function tableMatches(tableVal, tNum){
  return assignedTableNumbers(tableVal).includes(Number(tNum));
}

function occupiedTableCount(dateKey,slot){
  const list=(reservations[dateKey]||{})[slot]||[];
  return ALL_TABLES.filter(tableNumber=>list.some(r=>tableMatches(r.table,tableNumber))).length;
}

function capacityStatus(dateKey,slot){
  const occupied=occupiedTableCount(dateKey,slot);
  return {occupied,total:ALL_TABLES.length,ratio:occupied/ALL_TABLES.length};
}

function showCapacityRisk(dateKey,slot){
  const status=capacityStatus(dateKey,slot);
  if(status.ratio<0.7) return false;
  const d=new Date(dateKey+'T00:00:00');
  const period=slot==='am'?'오전':'오후';
  const percent=Math.round(status.ratio*100);
  const title=status.ratio>=1?'배치도 만석 위험':'배치도 혼잡 주의';
  const body=`${d.getMonth()+1}/${d.getDate()} ${period} 테이블 ${status.occupied}/${status.total}개 (${percent}%) 지정`;
  showBanner(`${title} · ${body}`);
  showNotification(title,body,{banner:false});
  return true;
}

function getBookings(tNum){
  const data=reservations[currentDateKey]||{am:[],pm:[]};
  const tag=r=>Object.assign({},r,{dateKey:currentDateKey});
  return{
    am:data.am.filter(r=>tableMatches(r.table,tNum)).map(tag),
    pm:data.pm.filter(r=>tableMatches(r.table,tNum)).map(tag)
  };
}
function cellClass(tNum){
  const b=getBookings(tNum);
  if(b[mapPeriod].length)return mapPeriod==='am'?'booked-am':'booked-pm';
  return'vacant';
}

function tableBookingStyle(bookings){
  const colors=[...new Set(bookings.map(r=>bookingColor(r.time,reservationRound(r)).bg))];
  if(!colors.length) return '';
  if(colors.length===1){
    const color=bookingColor(bookings[0].time,reservationRound(bookings[0]));
    return `background:${color.bg};border-color:${color.border}`;
  }
  const step=100/colors.length;
  const stops=colors.map((color,index)=>`${color} ${index*step}% ${(index+1)*step}%`).join(',');
  return `background:linear-gradient(135deg,${stops});border-color:#8f867d`;
}

// ── 테이블 셀 HTML ────────────────────────────────────
function tblHTML(num){
  const b=getBookings(num);
  const cls=cellClass(num);
  const visible=b[mapPeriod];
  let chips='';
  visible.forEach(r=>{
    const color=bookingColor(r.time,reservationRound(r));
    chips+=`<div class="booking-chip" style="background:${color.bg};color:${color.text};border:1px solid ${color.border}">${escapeHtml(displayTime(r.time))} ${escapeHtml(r.name)}</div>`;
  });
  const bookingStyle=tableBookingStyle(visible);
  // 이동 모드: 출발 테이블 강조, 다른 테이블은 선택 대상
  if(moveMode){
    const isFrom = String(moveMode.fromTable)===String(num);
    const moveStyle = isFrom ? 'outline:2px solid var(--am);outline-offset:-2px;opacity:.6' : 'outline:2px dashed var(--green);outline-offset:-2px';
    return`<div class="tbl-cell ${cls}" style="${bookingStyle};${moveStyle}" onclick="applyMove(${num})">
      <div class="tbl-num">${num}</div>${chips}
    </div>`;
  }
  return`<div class="tbl-cell ${cls}" style="${bookingStyle}" onclick="showTableDetail(${num})">
    <div class="tbl-num">${num}</div>${chips}
  </div>`;
}

// ── 모바일 팝업 ───────────────────────────────────────
function showTableDetail(tNum){
  const allReservations=(reservations[currentDateKey]||{})[mapPeriod]||[];
  const tableReservations=allReservations.filter(r=>tableMatches(r.table,tNum));
  const isOccupied=tableReservations.length>0;
  const list=isOccupied
    ? tableReservations
    : allReservations.filter(r=>assignedTableNumbers(r.table).length===0);
  document.getElementById('popup-title').textContent=isOccupied
    ? `${tNum}번 테이블 예약 · ${mapPeriod==='am'?'오전':'오후'}`
    : `${tNum}번 빈 테이블에 지정 · ${mapPeriod==='am'?'오전':'오후'}`;
  let html='';
  function rowHtml(r){
    const assignedHere=tableMatches(r.table,tNum);
    const cls=mapPeriod==='am'?'popup-time-am':'popup-time-pm';
    const color=bookingColor(r.time,reservationRound(r));
    return `<div class="popup-row">
      <span class="${cls}" style="color:${color.text}">${escapeHtml(displayTime(r.time))}</span>
      <span class="popup-name">${escapeHtml(r.name)}</span>
      <span class="popup-people">${escapeHtml(displayPeople(r.people))}</span>
      <button onclick='assignReservationToTable("${currentDateKey}","${mapPeriod}","${r.id}",${tNum})' style="margin-left:8px;background:${assignedHere?'#9a938c':'var(--green)'};color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">${assignedHere?'지정됨':'이 테이블 지정'}</button>
    </div>${r.memo?`<div class="popup-memo" style="padding:2px 0 6px 58px;">${escapeHtml(r.memo)}</div>`:''}`;
  }
  list.forEach(r=>{html+=rowHtml(r);});
  if(!html){
    html=`<div class="popup-empty">${isOccupied?'이 테이블 예약이 없습니다.':'미지정 예약이 없습니다.'}</div>`;
  }
  document.getElementById('popup-body').innerHTML=html;
  document.getElementById('mobile-popup').classList.add('show');
  document.getElementById('popup-overlay').style.display='block';
}

function assignReservationToTable(dateKey,slot,id,tableNumber){
  const reservation=(reservations[dateKey]||{})[slot]?.find(r=>String(r.id)===String(id));
  if(!reservation) return;
  reservation.table=String(tableNumber);
  try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
  autoSyncPaused=true;
  saveToSheet();
  setTimeout(()=>{autoSyncPaused=false;},10000);
  renderMap();
  showTableDetail(tableNumber);
  showCapacityRisk(dateKey,slot);
  showBanner(`${reservation.name} 예약을 ${tableNumber}번 테이블에 지정했습니다`);
}
function closePopup(){
  document.getElementById('mobile-popup').classList.remove('show');
  document.getElementById('popup-overlay').style.display='none';
}

// ── 테이블 이동 ───────────────────────────────────────
let moveMode = null; // {dateKey, slot, id, fromTable}

function startMove(dateKey, slot, id, fromTable){
  moveMode = {dateKey, slot, id:String(id), fromTable};
  closePopup();
  showBanner(`이동할 테이블을 선택하세요 (${fromTable}번에서 이동)`);
  renderMap();
}

function cancelMove(){
  moveMode=null;
  renderMap();
}

async function applyMove(toTable){
  if(!moveMode) return;
  const {dateKey, slot, id, fromTable} = moveMode;
  const list = (reservations[dateKey]||{})[slot] || [];
  const r = list.find(x=>String(x.id)===id);
  if(!r){ moveMode=null; renderMap(); return; }
  if(String(fromTable)===String(toTable)){ moveMode=null; renderMap(); return; }

  r.table = String(toTable);
  moveMode=null;
  saveToSheet();
  showCapacityRisk(dateKey,slot);
  renderMap();

  // 채팅방에 이동 알림 등록
  const d=new Date(dateKey+'T00:00:00');
  const moveMsg = {
    id: Date.now(),
    time: new Date().toISOString(),
    sender: '시스템',
    system: true,
    text: `📍 ${d.getMonth()+1}월 ${d.getDate()}일 · ${r.name} ${fromTable}번 → ${toTable}번 이동`
  };
  chatMessages.push(moveMsg);
  saveChat(moveMsg);
  renderChat();
  showBanner(`${fromTable}번 → ${toTable}번 이동 완료`);
}

function isMyMessage(message){
  return Boolean(
    message &&
    !message.system &&
    message.sender!=='시스템' &&
    ((message.senderId && currentUser?.uid && message.senderId===currentUser.uid) ||
      (!message.senderId && message.sender===currentSender))
  );
}

    sender:'시스템',

  };
  chatMessages.push(message);

}

}

  if(!currentUser) return;
  profileNameRequired=required;
  const screen=document.getElementById('profile-name-screen');
  const input=document.getElementById('profile-name-input');
  document.getElementById('profile-name-error').textContent='';
  document.getElementById('profile-name-cancel').style.display=required?'none':'block';
  input.value=needsProfileName(currentUser)?'':currentSender;
  screen.style.display='flex';
  setTimeout(()=>input.focus(),0);
}

function closeProfileName(){
  if(profileNameRequired) return;
  document.getElementById('profile-name-screen').style.display='none';
}

async function saveProfileName(){
  const input=document.getElementById('profile-name-input');
  const error=document.getElementById('profile-name-error');
  const button=document.getElementById('profile-name-save');
  const name=input.value.trim();
  if(name.length<2 || name.length>20){
    error.textContent='이름은 2~20자로 입력하세요';
    return;
  }
  error.textContent='';
  button.disabled=true;
  button.textContent='저장 중...';
  try{
    const profile=await SangmuokDB.updateDisplayName(name);
    currentUser.name=profile.display_name;
    currentSender=profile.display_name;
    document.getElementById('my-profile').textContent=currentSender;
    try{localStorage.setItem('sangmuok_user',JSON.stringify(currentUser));}catch{}
    profileNameRequired=false;
    document.getElementById('profile-name-screen').style.display='none';
    renderChat();
  }catch(e){
    console.error(e);
    error.textContent=e.message||'이름 저장에 실패했어요';
  }finally{
    button.disabled=false;
    button.textContent='저장';
  }
}

// 원본 메시지에서 등록된 예약 찾기
function findReservationFromMessage(msg){
  const parsed=parseReservationText(msg.text);
  if(parsed.error) return null;
  const list=(reservations[parsed.dateKey]||{})[parsed.slot]||[];
  // 이름+시간 우선, 없으면 이름만
  let r=list.find(x=>x.name===parsed.name && x.time===parsed.timeLabel);
  if(!r) r=list.find(x=>x.name===parsed.name);
  return r ? {res:r, dateKey:parsed.dateKey, slot:parsed.slot} : null;
}

// 답장 텍스트에서 변경 내용 분석
function parseReplyDate(text){
  const normalized=normalizeReservationTypos(text);
  const today=new Date(todayKey()+'T00:00:00');
  let target=null;

  if(/(?:^|\s)오늘(?:로|으로)?(?:\s|$)/.test(normalized)){
    target=new Date(today);
  }else if(/(?:^|\s)(?:내일|낼)(?:로|으로)?(?:\s|$)/.test(normalized)){
    target=new Date(today);
    target.setDate(target.getDate()+1);
  }else if(/(?:^|\s)모레(?:로|으로)?(?:\s|$)/.test(normalized)){
    target=new Date(today);
    target.setDate(target.getDate()+2);
  }else{
    const monthDay=normalized.match(/(?:^|\s)(\d{1,2})\s*(?:월|\/)\s*(\d{1,2})\s*일?(?:로|으로)?(?:\s|$)/);
    if(monthDay){
      let year=today.getFullYear();
      const month=Number(monthDay[1]),day=Number(monthDay[2]);
      target=new Date(year,month-1,day);
      if(target<today) target=new Date(year+1,month-1,day);
      if(target.getMonth()!==month-1||target.getDate()!==day) target=null;
    }else{
      const dayOnly=normalized.match(/(?:^|\s)(\d{1,2})\s*일(?:로|으로)?(?:\s|$)/);
      if(dayOnly){
        const day=Number(dayOnly[1]);
        target=new Date(today.getFullYear(),today.getMonth(),day);
        if(target<today) target=new Date(today.getFullYear(),today.getMonth()+1,day);
        if(target.getDate()!==day) target=null;
      }
    }
  }
  if(!target||Number.isNaN(target.getTime())) return null;
  return `${target.getFullYear()}-${pad(target.getMonth()+1)}-${pad(target.getDate())}`;
}

function analyzeChange(text){
  const t=text.trim();
  const changes={};
  // 취소
  if(/취소|캔슬|노쇼|안와|안 와|안옴/.test(t)){ changes.cancel=true; return changes; }
  const changedDate=parseReplyDate(t);
  if(changedDate) changes.date=changedDate;
  // 시간 변경
  const timeMatch=t.match(/(\d{1,2}\s*시\s*\d{1,2}\s*분|\d{1,2}\s*시\s*반|\d{1,2}:\d{2}|\d{1,2}\s*시)/);
  if(timeMatch && /변경|으로|로|바꿔|수정/.test(t)){
    const to=parseTimeStr(timeMatch[1].replace(/\s/g,''));
    if(to && to.h>=11 && to.h<22){ changes.time={h:to.h,m:to.m}; }
  }else if(timeMatch && /시|:/.test(timeMatch[1])){
    const to=parseTimeStr(timeMatch[1].replace(/\s/g,''));
    if(to && to.h>=11 && to.h<22){ changes.time={h:to.h,m:to.m}; }
  }
  // 인원 변경: "8명", "총 9명", "3명 추가"
  const addMatch=t.match(/(\d+)\s*명?\s*추가/);
  const totalMatch=t.match(/총\s*(\d+)\s*명/);
  const peopleMatch=t.match(/(\d+[.\/+]?\d*)\s*명/);
  if(totalMatch){ changes.people=totalMatch[1]; }
  else if(addMatch){ changes.peopleAdd=parseInt(addMatch[1]); }
  else if(peopleMatch && /변경|으로|로|명$/.test(t)){ changes.people=peopleMatch[1].replace(/[.+]/g,'/'); }
  // 테이블 변경
  if(assignedTableNumbers(t).length && /테이블|자리|[Tt]|룸|홀|배치/.test(t)){
    changes.table=t
      .replace(/테이블|자리|배치|변경|수정|지정|해주세요|해줘|으로/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }
  return changes;
}

// 답장으로 예약 수정 처리 (확인 팝업)
function tryModifyByReply(replyMsg, replyText){
  const found=findReservationFromMessage(replyMsg);
  if(!found){
    return false; // 원본 예약 못 찾음 → 일반 답장으로
  }
  const {res, dateKey, slot}=found;
  const changes=analyzeChange(replyText);
  if(Object.keys(changes).length===0) return false; // 변경 내용 없음 → 일반 답장

  // 취소
  if(changes.cancel){
    if(confirm(`예약을 취소할까요?\n\n${res.name} ${res.time} ${res.people}명`)){
      reservations[dateKey][slot]=reservations[dateKey][slot].filter(x=>String(x.id)!==String(res.id));
      try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
      autoSyncPaused=true;
      saveToSheet();
      setTimeout(()=>{autoSyncPaused=false;},10000);
      const d=new Date(dateKey+'T00:00:00');
      const cancelMsg={id:Date.now(),time:new Date().toISOString(),sender:'시스템',
        system:true,
        text:`❌ ${d.getMonth()+1}월 ${d.getDate()}일 · ${res.name} 예약 취소됨`};
      chatMessages.push(cancelMsg);
      saveChat(cancelMsg);
      render();renderChat();
      return true;
    }
    return true; // 취소 눌렀어도 처리한 걸로
  }

  // 변경 요약
  let summary=[], applied={};
  if(changes.date){
    const before=new Date(dateKey+'T00:00:00');
    const after=new Date(changes.date+'T00:00:00');
    summary.push(`날짜 ${before.getMonth()+1}/${before.getDate()} → ${after.getMonth()+1}/${after.getDate()}`);
    applied.date=changes.date;
  }
  if(changes.time){
    const newLabel=`${pad(changes.time.h)}:${pad(changes.time.m)}`;
    summary.push(`시간 ${res.time} → ${newLabel}`);
    applied.time=newLabel; applied.timeH=changes.time.h; applied.newSlot=changes.time.h<16?'am':'pm';
  }
  if(changes.people){ summary.push(`인원 ${res.people}명 → ${changes.people}명`); applied.people=changes.people; }
  if(changes.peopleAdd){
    const cur=parseInt(String(res.people).split('/')[0])||0;
    const nv=cur+changes.peopleAdd;
    summary.push(`인원 ${res.people}명 → ${nv}명`); applied.people=String(nv);
  }
  if(changes.table){ summary.push(`테이블 ${res.table||'미배정'} → ${changes.table}`); applied.table=changes.table; }

  if(summary.length===0) return false;

  if(confirm(`예약을 수정할까요?\n\n${res.name}\n${summary.join('\n')}`)){
    const targetDate=applied.date||dateKey;
    const targetSlot=applied.newSlot||slot;
    if(applied.time){ res.time=applied.time; res.timeH=applied.timeH; }
    if(applied.people!==undefined) res.people=applied.people;
    if(applied.table!==undefined) res.table=applied.table;
    if(targetDate!==dateKey||targetSlot!==slot){
      reservations[dateKey][slot]=reservations[dateKey][slot].filter(x=>String(x.id)!==String(res.id));
      if(!reservations[targetDate]) reservations[targetDate]={am:[],pm:[]};
      reservations[targetDate][targetSlot].push(res);
      reservations[targetDate][targetSlot].sort((a,b)=>a.time.localeCompare(b.time));
    }
    try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
    autoSyncPaused=true;
    saveToSheet();
    setTimeout(()=>{autoSyncPaused=false;},10000);
    const d=new Date(targetDate+'T00:00:00');
    const editMsg={id:Date.now(),time:new Date().toISOString(),sender:'시스템',
      system:true,
      text:`✏️ ${d.getMonth()+1}월 ${d.getDate()}일 · ${res.name} 수정: ${summary.join(', ')}`};
    chatMessages.push(editMsg);
    saveChat(editMsg);
    render();renderChat();
  }
  return true;
}

async function updateReservationFromEditedMessage(originalMessage,newText){
  const linked=findReservationFromMessage(originalMessage);
  if(!linked) return;
  const next=parseReservationText(newText);
  if(next.error) return;
  if(!confirm(`연결된 예약도 수정할까요?\n\n${linked.res.name} ${displayTime(linked.res.time)} ${displayPeople(linked.res.people)}`)) return;

  const reservation=linked.res;
  reservations[linked.dateKey][linked.slot]=reservations[linked.dateKey][linked.slot]
    .filter(item=>String(item.id)!==String(reservation.id));
  if(!reservations[next.dateKey]) reservations[next.dateKey]={am:[],pm:[]};
  reservation.time=next.timeLabel;
  reservation.timeH=next.timeH;
  reservation.name=next.name;
  reservation.people=next.people;
  reservation.memo=next.memo;
  if(next.table) reservation.table=next.table;
  reservations[next.dateKey][next.slot].push(reservation);
  reservations[next.dateKey][next.slot].sort((a,b)=>a.time.localeCompare(b.time));
  try{localStorage.setItem('sangmuok_v2',JSON.stringify(reservations));}catch{}
  autoSyncPaused=true;
  await saveToSheet();
  setTimeout(()=>{autoSyncPaused=false;},10000);
  const d=new Date(next.dateKey+'T00:00:00');
  addSystemChat(`✏️ ${d.getMonth()+1}월 ${d.getDate()}일 · ${reservation.name} 예약 수정됨 (예약톡 수정)`);
  render();
  renderMap();
}

async function saveMessageEdit(){
  const message=chatMessages.find(item=>String(item.id)===String(selectedMessageId));
  const textarea=document.getElementById('message-edit-text');
  const newText=textarea.value.trim();
  if(!message||!isMyMessage(message)) return;
  if(!newText){showBanner('메시지 내용을 입력하세요');return;}
  if(newText===message.text){closeMessageEdit();return;}

  const original={...message};
  const previousText=message.text;
  message.text=newText;
  try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
  renderChat();
  closeMessageEdit();
  try{
    const saved=await SangmuokDB.updateMessage(message.id,newText);
    const index=chatMessages.findIndex(item=>String(item.id)===String(message.id));
    if(index>=0) chatMessages[index]={...chatMessages[index],...saved};
    try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
    await updateReservationFromEditedMessage(original,newText);
    renderChat();
    showBanner('메시지를 수정했습니다');
  }catch(error){
    console.error(error);
    message.text=previousText;
    try{localStorage.setItem('sangmuok_chats',JSON.stringify(chatMessages));}catch{}
    renderChat();
    showBanner('메시지 수정에 실패했습니다');
  }
}
